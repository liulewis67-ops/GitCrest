  /api/v1/repositories/{repoId}/workflows/adopt:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: adoptRepositoryWorkflow
      summary: Track a merge, cherry-pick, revert or rebase that is already in progress as a waiting task
      description: Used when the operation was started outside GitCrest or before a restart. Does nothing when no operation is in progress or one is already tracked by a task.
