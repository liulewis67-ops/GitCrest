    post:
      operationId: pruneRepositoryWorktrees
      summary: Forget worktrees whose folders no longer exist
      responses:
        "202":
          description: Clean-up task accepted.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/worktrees/remove:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: removeRepositoryWorktree
      summary: Queue removal of a linked worktree
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveWorktreeRequest" }
      responses:
        "202":
          description: Removal task accepted.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/branches/delete-preview:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: previewRepositoryBranchDelete
      summary: Count branch commits not reachable from the current branch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchNameRequest" }
      responses:
        "200":
          description: Delete impact preview.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchDeletePreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository or local branch is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/branches/delete:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: deleteRepositoryBranch
      summary: Queue guarded deletion of a local branch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteBranchRequest" }
      responses:
        "202":
          description: Delete task accepted.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository or local branch is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "409":
          description: The branch is current, or unmerged commits need explicit confirmation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
  /api/v1/repositories/{repoId}/branches/remote-delete-preview:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: previewRepositoryRemoteBranchDelete
      summary: Review a remote branch ref, commits, and changed paths before deletion
      parameters:
        - name: remoteName
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
        - name: remoteBranch
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "200":
          description: Snapshot-bound remote delete impact and lease OID.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteBranchDeletePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository or remote-tracking branch is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/branches/remote-delete:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: deleteRepositoryRemoteBranch
      summary: Queue confirmed remote branch deletion with force-with-lease protection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoteBranchDeleteRequest" }
      responses:
        "202":
          description: Remote deletion task accepted after snapshot revalidation.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The repository or remote-tracking branch is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "409":
          description: A Git operation is active in the repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "412":
          description: The reviewed tracking ref or impact changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "503": { description: The task queue is full or Git cannot be started., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    get:
      operationId: listRepositories
      summary: List recent repositories saved on this device
      responses:
        "200":
          description: The complete repository list, ordered favorites first and then by last accessed time.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repository"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
    post:
      operationId: openRepository
      summary: Validate and register a user-selected local Git working tree
      description: The path is accepted only for this open operation. Subsequent repository operations use repoId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenRepositoryRequest"
      responses:
        "200":
          description: Repository opened or already registered in this session.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          description: Missing or malformed repository path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The selected path cannot be read by GitCrest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: The selected path does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "422":
          description: The selected folder is not a Git working tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The Git executable could not be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/clones:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: cloneRepository
      summary: Queue a clone into a user-selected parent folder
      description: Clones to a private staging folder and registers the repository only after a successful move.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [remoteUrl, parentPath, directoryName]
              properties:
                remoteUrl: { type: string, minLength: 1, maxLength: 2048 }
                parentPath: { type: string, minLength: 1 }
                directoryName: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "202":
          description: Clone task accepted.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: Remote or destination is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: Destination already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The bounded task queue is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/events:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    get:
      operationId: subscribeToEvents
      summary: Subscribe to versioned repository and task events over WebSocket
      description: See events-v1.md for handshake and reconnect rules.
      x-websocket: true
      responses:
        "101":
          description: WebSocket upgraded. The authorization header is mandatory.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
  /api/v1/tasks:
