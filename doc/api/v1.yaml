  /api/v1/repositories/{repoId}/fetch:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    post:
      operationId: fetchRepository
      summary: Queue a fetch task for a registered repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prune]
              properties:
                prune:
                  type: boolean
                background:
                  type: boolean
                  default: false
                  description: >-
                    A scheduled fetch the user did not ask for. It runs as the fetchBackground operation and is
                    refused with 409 while another task of the repository is queued or running.
      responses:
        "202":
          description: Fetch task accepted and durably recorded before execution.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: Fetch options are malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: A background fetch was skipped because another task of the repository is queued or running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The repository is not registered or no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "503":
          description: The task queue is full or Git cannot be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
