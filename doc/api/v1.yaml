      operationId: pushRepository
      summary: Queue a push using a reviewed preflight snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRequest"
      responses:
        "202":
          description: Push task accepted and durably recorded before execution.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: Push request is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository is not registered or its path is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: The preview is stale, there is nothing to push, or normal push requires fetching first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The task queue is full or Git cannot be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: taskId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTask
      summary: Read a task and its sanitized logs
      responses:
        "200":
          description: Task state.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The task is not retained in this sidecar session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
  /api/v1/tasks/{taskId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: taskId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: cancelTask
      summary: Request cooperative cancellation of a task
      description: Cancellation is an intent. A running task becomes cancelled only after its operation reaches a safe stop point.
      responses:
        "200":
          description: The latest task state after recording the cancellation request.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The task is not retained in this sidecar session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
components:
  securitySchemes:
    sessionBearer:
      type: http
      scheme: bearer
      bearerFormat: session token
  headers:
    ApiVersion:
      description: Major API contract version used by this response.
      schema:
        type: string
        const: "1"
  responses:
    BadRequest:
      description: The request body or branch name is invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Unauthorized:
      description: Missing or invalid session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              code: AUTH_UNAUTHORIZED
              message: A valid session bearer token is required.
    Forbidden:
      description: The caller is authenticated but does not have the requested window capability.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              code: AUTH_FORBIDDEN
              message: This window has read-only access.
    UnsupportedVersion:
      description: The requested API major version is not supported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              code: API_VERSION_UNSUPPORTED
              message: The requested API major version is not supported.
    StateConflict:
      description: The operation conflicts with the repository's current Git state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              code: REPOSITORY_STATE_CONFLICT
              message: A merge is already in progress.
    StaleResource:
      description: The supplied resource version or precondition has expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              code: RESOURCE_VERSION_STALE
              message: The resource changed since it was read. Refresh and retry.
  parameters:
    ApiVersion:
      name: X-GitCrest-API-Version
      in: header
      required: true
      schema:
        type: string
        const: "1"
    DiffContext:
      name: context
      in: query
      required: false
      description: >-
        `hunks` (default) returns changes with three lines of context; staging selections address
        these hunk and row indexes. `full` returns the whole file as one hunk for reading both sides
        in full; its revision and indexes are not accepted by staging, discard, or commit selections.
      schema:
        type: string
        enum: [hunks, full]
        default: hunks
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, pattern: "^acct_[0-9a-f]{32}$" }
    FlowId:
      name: flowId
      in: path
      required: true
      schema: { type: string, pattern: "^flow_[0-9a-f]{32}$" }
  schemas:
    RepoId:
      type: string
      minLength: 1
      maxLength: 128
      description: Opaque, stable ID assigned by RepositoryManager; never a filesystem path.
      example: repo_01J9M6G3C4Y4Y2B8YH7AKQ2K8N
    VersionResponse:
      type: object
      additionalProperties: false
      required: [name, version, apiVersion]
      properties:
        name:
          type: string
        version:
          type: string
        apiVersion:
          type: integer
          const: 1
    Repository:
      type: object
      additionalProperties: false
      required: [repoId, path, head, branch, detached, state, isFavorite, lastAccessedAt, availability]
      properties:
        repoId:
          $ref: "#/components/schemas/RepoId"
        path:
          type: string
        head:
          type: [string, "null"]
        branch:
          type: [string, "null"]
        detached:
          type: boolean
        state:
          type: string
          enum: [normal, merging, rebasing, cherryPicking, bisecting]
        isFavorite:
          type: boolean
        lastAccessedAt:
          type: integer
          format: int64
          minimum: 0
        availability:
          type: string
          enum: [available, missing]
    StatusSnapshot:
      type: object
      additionalProperties: false
      required: [repoId, refreshedAtMs, files]
      properties:
        repoId:
          $ref: "#/components/schemas/RepoId"
        refreshedAtMs:
          type: integer
          format: int64
          minimum: 0
        files:
          type: array
          items:
            $ref: "#/components/schemas/StatusFile"
    StatusFile:
      type: object
      additionalProperties: false
      required: [path, indexStatus, worktreeStatus, kind, categories, modeChanged]
      properties:
        path:
          type: string
        originalPath:
          type: string
        indexStatus:
          type: string
          minLength: 1
          maxLength: 1
        worktreeStatus:
          type: string
          minLength: 1
          maxLength: 1
        kind:
          type: string
          enum: [modified, added, deleted, renamed, copied, typeChanged, untracked, ignored, conflicted]
        categories:
          type: array
          items:
            type: string
            enum: [staged, unstaged, untracked, ignored, conflicted]
        modeChanged:
          type: boolean
    DiffDocument:
      type: object
      additionalProperties: false
      required: [repoId, path, revision, originalPath, scope, changeKind, status, hunks]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        path: { type: string }
        revision: { type: string, minLength: 1 }
        originalPath: { type: [string, "null"] }
        scope: { type: string, enum: [workingTree, index, commit] }
        changeKind: { type: string, enum: [modified, added, deleted, renamed, copied, typeChanged, untracked, ignored, conflicted] }
        status: { type: string, enum: [text, binary, empty, conflicted, ignored, symlink, submodule] }
        hunks:
          type: array
          items: { $ref: "#/components/schemas/DiffHunk" }
    BlameDocument:
      type: object
      additionalProperties: false
      required: [repoId, path, revision, lines]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        path: { type: string }
        revision: { type: [string, "null"] }
        lines:
          type: array
          items: { $ref: "#/components/schemas/BlameLine" }
    BlameLine:
      type: object
      additionalProperties: false
      required: [lineNumber, originalLineNumber, commitOid, authorName, authorEmail, committedAtMs, summary, text]
      properties:
        lineNumber: { type: integer, minimum: 1 }
        originalLineNumber: { type: integer, minimum: 1 }
        commitOid: { type: string, pattern: "^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$" }
        authorName: { type: string }
        authorEmail: { type: string }
        committedAtMs: { type: integer, format: int64 }
        summary: { type: string }
        text: { type: string }
    DiffHunk:
      type: object
      additionalProperties: false
      required: [oldStart, oldLines, newStart, newLines, rows]
      properties:
        oldStart: { type: integer, minimum: 0 }
        oldLines: { type: integer, minimum: 0 }
        newStart: { type: integer, minimum: 0 }
        newLines: { type: integer, minimum: 0 }
        rows:
          type: array
          items: { $ref: "#/components/schemas/DiffRow" }
    DiffRow:
      type: object
      additionalProperties: false
      required: [kind, oldLine, newLine, oldText, newText]
      properties:
        kind: { type: string, enum: [context, change] }
        oldLine: { type: [integer, "null"], minimum: 0 }
        newLine: { type: [integer, "null"], minimum: 0 }
        oldText: { type: [string, "null"] }
        newText: { type: [string, "null"] }
    StagingRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [stageFile, unstageFile, stageAll, unstageAll, stagePaths, unstagePaths]
        path:
          type: string
          minLength: 1
          description: Repository-relative path, required for stageFile and unstageFile and forbidden for every other action.
        paths:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: string
            minLength: 1
          description: Distinct repository-relative paths, required for stagePaths and unstagePaths and forbidden for every other action. All of them are staged or unstaged by one Git command.
    CommitPage:
      type: object
      additionalProperties: false
      required: [repoId, offset, limit, commits, nextOffset]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        commits:
          type: array
          items: { $ref: "#/components/schemas/CommitSummary" }
        nextOffset: { type: [integer, "null"], minimum: 0 }
        searchPending:
          type: boolean
          description: True when a message search is waiting for the repository history index; retry the same query and offset.
    CommitSummary:
      type: object
      additionalProperties: false
      required: [oid, parents, authorName, authorEmail, committedAtMs, subject]
      properties:
        oid: { type: string, pattern: "^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$" }
        parents:
          type: array
          items: { type: string }
        authorName: { type: string }
        authorEmail: { type: string }
        committedAtMs: { type: integer, format: int64 }
        subject: { type: string }
    CommitDetail:
      type: object
      additionalProperties: false
      required: [repoId, oid, parents, authorName, authorEmail, committedAtMs, message, stats, files]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        oid: { type: string }
        parents:
          type: array
          items: { type: string }
        authorName: { type: string }
        authorEmail: { type: string }
        committedAtMs: { type: integer, format: int64 }
        message: { type: string }
        stats: { $ref: "#/components/schemas/CommitStats" }
        files:
          type: array
          items: { $ref: "#/components/schemas/CommitFileStat" }
    CommitStats:
      type: object
      additionalProperties: false
      required: [filesChanged, insertions, deletions]
      properties:
        filesChanged: { type: integer, minimum: 0 }
        insertions: { type: integer, format: int64, minimum: 0 }
        deletions: { type: integer, format: int64, minimum: 0 }
    CommitFileStat:
      type: object
      additionalProperties: false
      required: [path, additions, deletions]
      properties:
        path: { type: string }
        additions: { type: [integer, "null"], format: int64, minimum: 0, description: Null for binary content. }
        deletions: { type: [integer, "null"], format: int64, minimum: 0, description: Null for binary content. }
    CreateTagRequest:
      type: object
      additionalProperties: false
      required: [name, message]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        message: { type: string, maxLength: 8192, description: Optional annotation body; an empty message is permitted. }
    CreatedTag:
      type: object
      additionalProperties: false
      required: [repoId, name, fullName, oid]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        name: { type: string }
        fullName: { type: string }
        oid: { type: string, pattern: "^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$" }
    RefSnapshot:
      type: object
      additionalProperties: false
      required: [repoId, head, branch, detached, refs]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        head: { type: [string, "null"] }
        branch: { type: [string, "null"] }
        detached: { type: boolean }
        refs:
          type: array
          items: { $ref: "#/components/schemas/RepositoryRef" }
    RepositoryRef:
      type: object
      additionalProperties: false
      required: [name, fullName, oid, kind, upstream]
      properties:
        name: { type: string }
        fullName: { type: string }
        oid: { type: string }
        kind: { type: string, enum: [local, remote] }
        upstream: { type: [string, "null"] }
    BranchSnapshot:
      type: object
      additionalProperties: false
      required: [repoId, current, detached, branches]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        current: { type: [string, "null"] }
        detached: { type: boolean }
        branches:
          type: array
          items: { $ref: "#/components/schemas/BranchRef" }
    BranchRef:
      type: object
      additionalProperties: false
      required: [name, fullName, oid, kind, isCurrent, isFavorite, upstream, upstreamGone, ahead, behind]
      properties:
        name: { type: string }
        fullName: { type: string }
        oid: { type: string, pattern: "^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$" }
        kind: { type: string, enum: [local, remote] }
        isCurrent: { type: boolean }
        isFavorite: { type: boolean }
        upstream: { type: [string, "null"] }
        upstreamGone: { type: boolean }
        ahead: { type: [integer, "null"], minimum: 0 }
        behind: { type: [integer, "null"], minimum: 0 }
        worktreePath: { type: string, description: Folder of another working tree that has this branch checked out; omitted otherwise. }
    CreateBranchRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        checkout: { type: boolean, default: false }
        worktreePath: { type: string, minLength: 1, maxLength: 4096 }
        startPoint: { type: string, minLength: 4, maxLength: 64, description: Commit ID the new branch starts at; defaults to HEAD. }
        copyFiles: { type: array, maxItems: 100, items: { type: string, maxLength: 4096 }, description: Small Git-ignored files to copy into the new worktree; only valid with worktreePath. }
    RenameBranchRequest:
      type: object
      additionalProperties: false
      required: [name, newName]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        newName: { type: string, minLength: 1, maxLength: 255 }
    BranchNameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
    BranchFavoriteRequest:
      type: object
      additionalProperties: false
      required: [fullName, favorite]
      properties:
        fullName: { type: string, minLength: 1 }
        favorite: { type: boolean }
    DeleteTagRequest:
      type: object
      additionalProperties: false
      required: [name, expectedTargetOid]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        expectedTargetOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$", description: The commit the tag pointed at when it was reviewed. }
    DeletedTag:
      type: object
      additionalProperties: false
      required: [repoId, name]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        name: { type: string }
    RemoteTagPreview:
      type: object
      additionalProperties: false
      required: [repoId, remoteName, name, remoteOid, localOid, sameAsLocal]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        remoteName: { type: string }
        name: { type: string }
        remoteOid: { type: [string, "null"], description: The object the remote tag points at; null when the remote has no such tag. }
        localOid: { type: [string, "null"], description: The object the local tag points at; null when there is no local tag. }
        sameAsLocal: { type: boolean }
    PushTagRequest:
      type: object
      additionalProperties: false
      required: [remoteName, name]
      properties:
        remoteName: { type: string, minLength: 1, maxLength: 255 }
        name: { type: string, minLength: 1, maxLength: 255 }
    DeleteRemoteTagRequest:
      type: object
      additionalProperties: false
      required: [remoteName, name, expectedRemoteOid]
      properties:
        remoteName: { type: string, minLength: 1, maxLength: 255 }
        name: { type: string, minLength: 1, maxLength: 255 }
        expectedRemoteOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$", description: The object read by the preview; the remote deletes the tag only while it still points there. }
    IgnoreMode:
      type: string
      enum: [file, extension, folder]
      description: Ignore exactly this path, every file with its extension, or the folder that holds it.
    IgnoreTarget:
      type: string
      enum: [gitignore, exclude]
      description: The shared .gitignore at the repository root, or the private .git/info/exclude.
    IgnoreRuleRequest:
      type: object
      additionalProperties: false
      required: [path, mode, target]
      properties:
        path: { type: string, minLength: 1, maxLength: 1024 }
        mode: { $ref: "#/components/schemas/IgnoreMode" }
        target: { $ref: "#/components/schemas/IgnoreTarget" }
    IgnoreRule:
      type: object
      additionalProperties: false
      required: [repoId, line, file, alreadyPresent]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        line: { type: string }
        file: { type: string }
        alreadyPresent: { type: boolean }
    StashPreview:
      type: object
      additionalProperties: false
      required: [repoId, oid, index, headOid, baseOid, paths, omittedPathCount, overlappingDirtyPaths, operationInProgress, canApply]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        oid: { type: string }
        index: { type: integer, minimum: 0 }
        headOid: { type: [string, "null"] }
        baseOid: { type: [string, "null"] }
        paths: { type: array, maxItems: 200, items: { type: string } }
        omittedPathCount: { type: integer, minimum: 0 }
        overlappingDirtyPaths: { type: array, items: { type: string }, description: Paths with local changes that the stash also changes. }
        operationInProgress: { type: boolean }
        canApply: { type: boolean }
    StashApplyRequest:
      type: object
      additionalProperties: false
      required: [oid, pop]
      properties:
        oid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        pop: { type: boolean }
        expectedHeadOid: { type: [string, "null"], description: HEAD when the entry was reviewed; the apply is refused if it moved. }
    StashDropRequest:
      type: object
      additionalProperties: false
      required: [oid]
      properties:
        oid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
    StashDropped:
      type: object
      additionalProperties: false
      required: [repoId, oid]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        oid: { type: string }
    StashImportRequest:
      type: object
      additionalProperties: false
      required: [oid, dropAfter]
      properties:
        oid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        name: { type: [string, "null"], maxLength: 120 }
        dropAfter: { type: boolean }
    StashImported:
      type: object
      additionalProperties: false
      required: [repoId, shelfId, name, pathCount, dropped]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        shelfId: { type: string }
        name: { type: string }
        pathCount: { type: integer, minimum: 0 }
        dropped: { type: boolean }
    LfsStatus:
      type: object
      additionalProperties: false
      required: [installed, version]
      properties:
        installed: { type: boolean }
        version: { type: [string, "null"], description: The first line of git lfs version. }
    SigningConfig:
      type: object
      additionalProperties: false
      required: [repoId, format, signingKey, signByDefault, program]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        format: { type: string, enum: [openpgp, ssh, x509] }
        signingKey: { type: [string, "null"], description: "user.signingkey: a key id, a public key or a key file path." }
        signByDefault: { type: boolean, description: commit.gpgsign. }
        program: { type: [string, "null"], description: The configured signing program; null when Git's default for the format is used. }
    SigningTestResult:
      type: object
      additionalProperties: false
      required: [repoId, signed, output]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        signed: { type: boolean }
        output: { type: string, description: What the signing tool said when it failed; empty on success. }
    ReflogEntry:
      type: object
      additionalProperties: false
      required: [index, oid, selector, message, createdAtMs]
      properties:
        index: { type: integer, minimum: 0 }
        oid: { type: string }
        selector: { type: string, description: "The reflog position, such as HEAD@{3}." }
        message: { type: string }
        createdAtMs: { type: integer }
    ReflogBackup:
      type: object
      additionalProperties: false
      required: [reference, oid, kind, subject, createdAtMs]
      properties:
        reference: { type: string }
        oid: { type: string }
        kind: { type: string, enum: [rebase, reset] }
        subject: { type: string }
        createdAtMs: { type: integer }
    ReflogPage:
      type: object
      additionalProperties: false
      required: [repoId, ref, offset, limit, entries, nextOffset, backups]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        ref: { type: string }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        entries: { type: array, items: { $ref: "#/components/schemas/ReflogEntry" } }
        nextOffset: { type: [integer, "null"] }
        backups: { type: array, items: { $ref: "#/components/schemas/ReflogBackup" } }
    CompareCommit:
      type: object
      additionalProperties: false
      required: [oid, shortOid, subject, authorName, authoredAtMs]
      properties:
        oid: { type: string }
        shortOid: { type: string }
        subject: { type: string }
        authorName: { type: string }
        authoredAtMs: { type: integer }
    CompareFile:
      type: object
      additionalProperties: false
      required: [path, originalPath, kind]
      properties:
        path: { type: string }
        originalPath: { type: [string, "null"] }
        kind: { type: string, enum: [added, deleted, modified, renamed, copied, typeChanged] }
    CompareCommitList:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CompareCommit" } }
        hasMore: { type: boolean }
    CompareFileList:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CompareFile" } }
        hasMore: { type: boolean }
    CompareResult:
      type: object
      additionalProperties: false
      required: [repoId, base, head, baseOid, headOid, fromOid, mergeBaseOid, mode, offset, limit, onlyInBase, onlyInHead, files]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        base: { type: string }
        head: { type: [string, "null"] }
        baseOid: { type: string }
        headOid: { type: [string, "null"], description: Null when the head side is the working tree. }
        fromOid: { type: string, description: The commit the changed files start from; pass it as "from" to the compare diff. }
        mergeBaseOid: { type: [string, "null"] }
        mode: { type: string, enum: [threeDot, twoDot] }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        onlyInBase: { $ref: "#/components/schemas/CompareCommitList" }
        onlyInHead: { $ref: "#/components/schemas/CompareCommitList" }
        files: { $ref: "#/components/schemas/CompareFileList" }
    SubmoduleEntry:
      type: object
      additionalProperties: false
      required: [name, path, url, recordedOid, committedOid, checkedOutOid, state]
      properties:
        name: { type: string }
        path: { type: string }
        url: { type: [string, "null"] }
        recordedOid: { type: [string, "null"], description: The commit the index records for the path. }
        committedOid: { type: [string, "null"], description: The commit the last commit records for the path. }
        checkedOutOid: { type: [string, "null"], description: The commit checked out in the submodule; null until it is initialized. }
        state: { type: string, enum: [uninitialized, upToDate, outOfDate, conflicted] }
    SubmoduleList:
      type: object
      additionalProperties: false
      required: [repoId, items]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        items: { type: array, items: { $ref: "#/components/schemas/SubmoduleEntry" } }
    SubmoduleUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        paths: { type: array, maxItems: 500, items: { type: string, minLength: 1, maxLength: 4096 }, description: Submodule paths from the list; empty means all that can be updated. }
        init: { type: boolean, default: false }
    StashEntry:
      type: object
      additionalProperties: false
      required: [index, oid, baseOid, untrackedOid, branch, message, createdAtMs]
      properties:
        index: { type: integer, minimum: 0, description: "Position in the list, as in stash@{index}." }
        oid: { type: string }
        baseOid: { type: [string, "null"] }
        untrackedOid: { type: [string, "null"], description: Commit holding untracked files for a stash made with --include-untracked. }
        branch: { type: [string, "null"] }
        message: { type: string }
        createdAtMs: { type: integer }
    StashList:
      type: object
      additionalProperties: false
      required: [repoId, stashes]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        stashes: { type: array, items: { $ref: "#/components/schemas/StashEntry" } }
    TagEntry:
      type: object
      additionalProperties: false
      required: [name, targetOid, annotated, taggerName, createdAtMs, message]
      properties:
        name: { type: string }
        targetOid: { type: string, description: The commit the tag points at. }
        annotated: { type: boolean }
        taggerName: { type: [string, "null"] }
        createdAtMs: { type: [integer, "null"] }
        message: { type: [string, "null"], description: First line of an annotated tag's message. }
    TagPage:
      type: object
      additionalProperties: false
      required: [repoId, offset, limit, tags, nextOffset]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        tags: { type: array, items: { $ref: "#/components/schemas/TagEntry" } }
        nextOffset: { type: [integer, "null"] }
    GitIdentity:
      type: object
      additionalProperties: false
      required: [name, email, nameScope, emailScope, resolved]
      properties:
        name: { type: [string, "null"] }
        email: { type: [string, "null"] }
        nameScope:
          type: [string, "null"]
          description: Where Git found the name, for example local or global.
        emailScope: { type: [string, "null"] }
        resolved:
          type: boolean
          description: Both a name and an email are set, so a commit will not fail for a missing identity.
    SetIdentityRequest:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 256 }
        email: { type: string, minLength: 3, maxLength: 256 }
    PipelineExecutionMode:
      type: string
      enum: [temporaryWorktree, switchInPlace]
    PipelineInPlaceDirtyPolicy:
      type: string
      enum: [shelve, refuse]
    PipelineAppSettings:
      type: object
      additionalProperties: false
      required: [executionMode, inPlaceDirtyPolicy]
      properties:
        executionMode: { $ref: "#/components/schemas/PipelineExecutionMode" }
        inPlaceDirtyPolicy: { $ref: "#/components/schemas/PipelineInPlaceDirtyPolicy" }
    PipelineRepositorySettingsRequest:
      type: object
      additionalProperties: false
      properties:
        executionMode:
          oneOf: [{ $ref: "#/components/schemas/PipelineExecutionMode" }, { type: "null" }]
        inPlaceDirtyPolicy:
          oneOf: [{ $ref: "#/components/schemas/PipelineInPlaceDirtyPolicy" }, { type: "null" }]
    PipelineRepositorySettings:
      type: object
      additionalProperties: false
      required: [executionMode, inPlaceDirtyPolicy, effectiveExecutionMode, effectiveInPlaceDirtyPolicy]
      properties:
        executionMode:
          oneOf: [{ $ref: "#/components/schemas/PipelineExecutionMode" }, { type: "null" }]
        inPlaceDirtyPolicy:
          oneOf: [{ $ref: "#/components/schemas/PipelineInPlaceDirtyPolicy" }, { type: "null" }]
        effectiveExecutionMode: { $ref: "#/components/schemas/PipelineExecutionMode" }
        effectiveInPlaceDirtyPolicy: { $ref: "#/components/schemas/PipelineInPlaceDirtyPolicy" }
    PipelineTrigger:
      type: object
      additionalProperties: false
      required: [kind, branchPattern]
      properties:
        kind: { type: string, enum: [afterPush] }
        branchPattern:
          type: string
          minLength: 1
          description: Glob over the short local branch name. * stays inside one path segment, ** crosses segments.
    PipelineTarget:
      type: object
      additionalProperties: false
      required: [branch, remote]
      properties:
        branch: { type: string, minLength: 1 }
        remote: { type: string, minLength: 1 }
    PipelineRule:
      type: object
      additionalProperties: false
      required: [ruleId, name, enabled, trigger, targets, mergeMode, commitMessageTemplate, pushAfterMerge, onConflict, afterConflictResolved, confirmation]
      properties:
        ruleId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        enabled: { type: boolean }
        trigger: { $ref: "#/components/schemas/PipelineTrigger" }
        targets:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PipelineTarget" }
        mergeMode: { type: string, enum: [noFastForward, fastForwardIfPossible] }
        commitMessageTemplate:
          type: string
          description: Placeholders are {source}, {target} and {sourceShortOid}.
        pushAfterMerge: { type: boolean }
        onConflict: { type: string, enum: [openResolver, skipTarget, stopRun] }
        afterConflictResolved: { type: string, enum: [continue, ask] }
        confirmation: { type: string, enum: [ask, auto] }
    PipelineRules:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules:
          type: array
          items: { $ref: "#/components/schemas/PipelineRule" }
    StartPipelineRunRequest:
      type: object
      additionalProperties: false
      properties:
        runId: { type: string, description: Confirms this run; do not combine with the manual fields. }
        ruleId: { type: string }
        sourceBranch: { type: string }
        sourceOid: { type: string, minLength: 40, maxLength: 40 }
        targets:
          type: array
          minItems: 1
          items: { type: string }
          description: Run only these target branches; the others are skipped.
    PipelineRunActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [resume, skipTarget, stop] }
    PipelineRunStep:
      type: object
      additionalProperties: false
      required: [position, targetBranch, remote, state, leaseOid, mergeOid, repoContext, message]
      properties:
        position: { type: integer, minimum: 0 }
        targetBranch: { type: string }
        remote: { type: string }
        state:
          type: string
          enum: [pending, preparing, merging, waitingForConflicts, pushing, finishing, done, upToDate, skipped, failed]
        leaseOid: { type: [string, "null"] }
        mergeOid: { type: [string, "null"] }
        repoContext:
          type: [string, "null"]
          description: RepoId of the hidden pipeline worktree; the conflict window and recovery routes serve this id while the step waits for conflicts.
        message: { type: [string, "null"] }
    PipelineRun:
      type: object
      additionalProperties: false
      required: [runId, repoId, ruleId, ruleName, sourceBranch, sourceOid, executionMode, status, shelfId, createdAtMs, updatedAtMs, steps]
      properties:
        runId: { type: string }
        repoId: { $ref: "#/components/schemas/RepoId" }
        ruleId: { type: string }
        ruleName: { type: string }
        sourceBranch: { type: string }
        sourceOid: { type: string }
        executionMode: { $ref: "#/components/schemas/PipelineExecutionMode" }
        status:
          type: string
          enum: [pendingConfirmation, running, waitingForConflicts, succeeded, partiallySucceeded, failed, cancelled]
        shelfId: { type: [string, "null"] }
        createdAtMs: { type: integer }
        updatedAtMs: { type: integer }
        steps:
          type: array
          items: { $ref: "#/components/schemas/PipelineRunStep" }
    PipelineRuns:
      type: object
      additionalProperties: false
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/PipelineRun" }
    BranchSwitchRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        remote:
          type: boolean
          default: false
          description: The name is a remote-tracking branch such as origin/feature.
        commit:
          type: boolean
          default: false
          description: The name is a commit id, checked out with a detached HEAD.
    BranchSwitchPreflight:
      type: object
      additionalProperties: false
      required: [repoId, current, target, localBranch, createsLocalBranch, detached, isClean, dirtyFiles, potentiallyOverwrittenPaths]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        current: { type: [string, "null"] }
        target: { type: string }
        localBranch:
          type: string
          description: The local branch that will be checked out; for a remote target, the branch that tracks it.
        createsLocalBranch:
          type: boolean
          description: No local branch tracks the remote target yet, so one is created.
        detached:
          type: boolean
          description: The target is a commit, so HEAD will be detached.
        isClean: { type: boolean }
        dirtyFiles: { type: array, items: { type: string } }
        potentiallyOverwrittenPaths: { type: array, items: { type: string } }
    PullPreflight:
      type: object
      additionalProperties: false
      required: [repoId, localBranch, remoteName, remoteBranch, localOid, trackingOid, ahead, behind, isClean, dirtyPaths, omittedDirtyPathCount, hasConflicts, operationInProgress]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        localBranch: { type: string }
        remoteName: { type: string }
        remoteBranch: { type: string }
        localOid: { type: string, minLength: 40, maxLength: 64 }
        trackingOid: { type: string, minLength: 40, maxLength: 64 }
        ahead: { type: integer, minimum: 0 }
        behind: { type: integer, minimum: 0 }
        isClean: { type: boolean }
        dirtyPaths: { type: array, maxItems: 200, items: { type: string } }
        omittedDirtyPathCount: { type: integer, minimum: 0 }
        hasConflicts: { type: boolean }
        operationInProgress: { type: boolean }
    PullRequest:
      type: object
      additionalProperties: false
      required: [expectedLocalOid, expectedTrackingOid, strategy]
      properties:
        expectedLocalOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        expectedTrackingOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        strategy: { type: string, enum: [merge, rebase], description: Explicit integration strategy selected by the user. }
    WorkflowPreflight:
      type: object
      additionalProperties: false
      required: [repoId, action, headOid, targetOid, targetSubject, operationInProgress, isClean, dirtyPaths, omittedDirtyPathCount, conflictedPaths, omittedConflictedPathCount, canStart, mergeKind, incomingCommitCount]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        action: { type: string, enum: [merge, cherryPick, revert] }
        headOid: { type: [string, "null"], minLength: 40, maxLength: 64 }
        targetOid: { type: string, minLength: 40, maxLength: 64 }
        targetSubject: { type: string, maxLength: 4096 }
        operationInProgress: { type: [string, "null"], enum: [merge, cherryPick, revert, rebase, null] }
        isClean: { type: boolean }
        dirtyPaths: { type: array, maxItems: 200, items: { type: string } }
        omittedDirtyPathCount: { type: integer, minimum: 0 }
        conflictedPaths: { type: array, maxItems: 200, items: { type: string } }
        omittedConflictedPathCount: { type: integer, minimum: 0 }
        canStart: { type: boolean }
        mergeKind: { type: [string, "null"], enum: [upToDate, fastForward, mergeCommit, null], description: How a merge target relates to HEAD; null for other actions. }
        incomingCommitCount: { type: [integer, "null"], minimum: 0, description: Commits reachable from the merge target but not from HEAD. }
    RebaseCommit:
      type: object
      additionalProperties: false
      required: [oid, subject]
      properties:
        oid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        subject: { type: string, maxLength: 4096 }
    RebasePreview:
      type: object
      additionalProperties: false
      required: [repoId, headOid, ontoOid, currentBranch, commits, omittedCommitCount, publishedCommitOids, dirtyPaths, omittedDirtyPathCount, operationInProgress, previewRevision, canStart]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        headOid: { type: [string, "null"], minLength: 40, maxLength: 64 }
        ontoOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        currentBranch: { type: [string, "null"], maxLength: 1024 }
        commits: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/RebaseCommit" } }
        omittedCommitCount: { type: integer, minimum: 0 }
        publishedCommitOids: { type: array, maxItems: 200, items: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" } }
        dirtyPaths: { type: array, maxItems: 200, items: { type: string } }
        omittedDirtyPathCount: { type: integer, minimum: 0 }
        operationInProgress: { type: [string, "null"], enum: [merge, cherryPick, revert, rebase, shelfApply, null] }
        previewRevision: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        canStart: { type: boolean }
    RebaseRequest:
      type: object
      additionalProperties: false
      required: [expectedHeadOid, expectedOntoOid, previewRevision, todo, confirmDrop, confirmPublishedRewrite]
      properties:
        expectedHeadOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        expectedOntoOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        previewRevision: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        todo: { type: array, minItems: 1, maxItems: 200, items: { $ref: "#/components/schemas/RebaseTodoItem" } }
        confirmDrop: { type: boolean, description: Required when any commit uses the drop action. }
        confirmPublishedRewrite: { type: boolean, description: Required when any commit is reachable from a remote-tracking ref. }
    RebaseTodoItem:
      type: object
      additionalProperties: false
      required: [oid, action]
      properties:
        oid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        action: { type: string, enum: [pick, reword, edit, squash, fixup, drop] }
        message: { type: [string, "null"], maxLength: 4096, description: Replacement commit message for reword. }
    RebaseBackup:
      type: object
      additionalProperties: false
      required: [reference, oid, subject]
      properties:
        reference: { type: string, pattern: "^refs/gitcrest/rebase-backups/[A-Za-z0-9-]+$" }
        oid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        subject: { type: string, maxLength: 4096 }
    RebaseBackupSnapshot:
      type: object
      additionalProperties: false
      required: [headOid, currentBranch, dirtyPaths, operationInProgress, backups, canRollback]
      properties:
        headOid: { type: [string, "null"], minLength: 40, maxLength: 64 }
        currentBranch: { type: [string, "null"], maxLength: 1024 }
        dirtyPaths: { type: array, maxItems: 200, items: { type: string } }
        operationInProgress: { type: [string, "null"], enum: [merge, cherryPick, revert, rebase, shelfApply, null] }
        backups: { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/RebaseBackup" } }
        canRollback: { type: boolean }
    RebaseRollbackRequest:
      type: object
      additionalProperties: false
      required: [expectedHeadOid, backupReference, backupOid, confirmRollback]
      properties:
        expectedHeadOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        backupReference: { type: string, pattern: "^refs/gitcrest/rebase-backups/[A-Za-z0-9-]+$" }
        backupOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        confirmRollback: { type: boolean, description: Must be true after explicit user confirmation. }
    ResetMode:
      type: string
      enum: [soft, mixed, hard]
    ResetPreview:
      type: object
      additionalProperties: false
      required: [repoId, expectedHeadOid, targetOid, currentBranch, mode, commitsRemoved, commitsAdded, affectedPaths, omittedPathCount, dirtyPaths, operationInProgress, previewRevision, canStart]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        expectedHeadOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        targetOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        currentBranch: { type: string, maxLength: 1024 }
        mode: { $ref: "#/components/schemas/ResetMode" }
        commitsRemoved: { type: integer, minimum: 0 }
        commitsAdded: { type: integer, minimum: 0 }
        affectedPaths: { type: array, maxItems: 200, items: { type: string } }
        omittedPathCount: { type: integer, minimum: 0 }
        dirtyPaths: { type: array, maxItems: 200, items: { type: string } }
        operationInProgress: { type: [string, "null"], enum: [merge, cherryPick, revert, rebase, shelfApply, null] }
        previewRevision: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        canStart: { type: boolean }
    ResetRequest:
      type: object
      additionalProperties: false
      required: [expectedHeadOid, targetOid, mode, previewRevision, confirmReset]
      properties:
        expectedHeadOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        targetOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        mode: { $ref: "#/components/schemas/ResetMode" }
        previewRevision: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        confirmReset: { type: boolean, description: Must be true after reviewing the affected commits and paths. }
    ResetBackup:
      type: object
      additionalProperties: false
      required: [reference, oid, subject]
      properties:
        reference: { type: string, pattern: "^refs/gitcrest/reset-backups/[A-Za-z0-9-]+$" }
        oid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        subject: { type: string, maxLength: 4096 }
    ResetBackupSnapshot:
      type: object
      additionalProperties: false
      required: [headOid, currentBranch, dirtyPaths, operationInProgress, backups, canRestore]
      properties:
        headOid: { type: [string, "null"], minLength: 40, maxLength: 64 }
        currentBranch: { type: [string, "null"], maxLength: 1024 }
        dirtyPaths: { type: array, maxItems: 200, items: { type: string } }
        operationInProgress: { type: [string, "null"], enum: [merge, cherryPick, revert, rebase, shelfApply, null] }
        backups: { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/ResetBackup" } }
        canRestore: { type: boolean }
    ResetRestoreRequest:
      type: object
      additionalProperties: false
      required: [expectedHeadOid, backupReference, backupOid, confirmRestore]
