          type: string
          enum: [none, followTags, all]
          default: none
          description: Tags to push with the branch. followTags sends annotated tags on the pushed commits; all sends every local tag. Never forces.
    RemoteSnapshot:
      type: object
      additionalProperties: false
      required: [repoId, defaultRemote, remotes]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        defaultRemote: { type: [string, "null"] }
        remotes:
          type: array
          maxItems: 128
          items: { $ref: "#/components/schemas/RemoteRef" }
    RemoteRef:
      type: object
      additionalProperties: false
      required: [name, fetchUrls, pushUrls, isDefault]
      properties:
        name: { type: string }
        fetchUrls:
          type: array
          items: { type: string, description: Display-safe URL; embedded user-info is redacted and query strings are omitted. }
        pushUrls:
          type: array
          items: { type: string, description: Display-safe URL; embedded user-info is redacted and query strings are omitted. }
        isDefault: { type: boolean }
    RemoteUrlRequest:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        url: { type: string, minLength: 1, maxLength: 2048, description: HTTPS or SSH Git URL without embedded credentials. }
    DefaultRemoteRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: [string, "null"], description: Null clears the preference and restores automatic origin selection. }
    BranchUpstreamRequest:
      type: object
      additionalProperties: false
      required: [localBranch, remoteName, remoteBranch]
      properties:
        localBranch: { type: string, minLength: 1, maxLength: 255 }
        remoteName: { type: string, minLength: 1, maxLength: 255 }
        remoteBranch: { type: string, minLength: 1, maxLength: 255 }
    SetCredentialRequest:
      type: object
      additionalProperties: false
      required: [host, username, token]
      properties:
        host: { type: string, minLength: 1, maxLength: 260, description: HTTPS host name, optionally including a non-default port. }
        username: { type: string, minLength: 1, maxLength: 255 }
        token: { type: string, minLength: 1, maxLength: 65536, writeOnly: true }
    CredentialStatus:
      type: object
      additionalProperties: false
      required: [host, username, isConfigured]
      properties:
        host: { type: string }
        username: { type: [string, "null"] }
        isConfigured: { type: boolean }
    HostingProvider:
      type: string
      enum: [github, gitlab]
    TokenSignInRequest:
      type: object
      additionalProperties: false
      required: [provider, host, token]
      properties:
        provider: { $ref: "#/components/schemas/HostingProvider" }
        host: { type: string, minLength: 1, maxLength: 260, description: "Host name such as github.com, gitlab.com or a self-managed instance, optionally with a non-default port." }
        token: { type: string, minLength: 1, maxLength: 65536, writeOnly: true, description: Personal access token. Surrounding whitespace is ignored. }
    DeviceFlowRequest:
      type: object
      additionalProperties: false
      required: [provider, host]
      properties:
        provider: { $ref: "#/components/schemas/HostingProvider" }
        host: { type: string, minLength: 1, maxLength: 260 }
    DeviceFlow:
      type: object
      additionalProperties: false
      required: [flowId, provider, host, userCode, verificationUri, verificationUriComplete, expiresAtMs, status, account, error]
      properties:
        flowId: { type: string, pattern: "^flow_[0-9a-f]{32}$" }
        provider: { $ref: "#/components/schemas/HostingProvider" }
        host: { type: string }
        userCode: { type: string, description: The code the user enters on the verification page. }
        verificationUri: { type: string, description: "HTTPS page on the provider's host where the user enters the code." }
        verificationUriComplete: { type: [string, "null"], description: The verification page with the code filled in, when the provider offers one. }
        expiresAtMs: { type: integer }
        status: { type: string, enum: [pending, completed, denied, expired, failed] }
        account:
          description: The signed-in account once status is completed.
          oneOf:
            - $ref: "#/components/schemas/Account"
            - type: "null"
        error:
          description: Why the flow failed, when status is failed.
          oneOf:
            - $ref: "#/components/schemas/ApiError"
            - type: "null"
    BrowserSignInHost:
      type: object
      additionalProperties: false
      required: [provider, host]
      properties:
        provider: { $ref: "#/components/schemas/HostingProvider" }
        host: { type: string }
    Account:
      type: object
      additionalProperties: false
      required: [accountId, provider, host, login, displayName, avatarUrl, authKind, scopes, tokenExpiresAtMs, state, selected, createdAtMs, lastValidatedAtMs]
      properties:
        accountId: { type: string, pattern: "^acct_[0-9a-f]{32}$" }
        provider: { $ref: "#/components/schemas/HostingProvider" }
        host: { type: string }
        login: { type: string }
        displayName: { type: [string, "null"] }
        avatarUrl: { type: [string, "null"], description: HTTPS avatar URL reported by the provider. }
        authKind: { type: string, enum: [token, oauth], description: "token: a pasted access token; oauth: browser sign-in." }
        scopes: { type: array, items: { type: string }, description: Token scopes when the provider reports them; empty when unknown. }
        tokenExpiresAtMs: { type: [integer, "null"], description: "For oauth accounts this is the short-lived access token's expiry, renewed automatically." }
        state: { type: string, enum: [active, needsReauth] }
        selected: { type: boolean, description: Whether Git uses this account for its host. }
        createdAtMs: { type: integer }
        lastValidatedAtMs: { type: integer }
    AccountList:
      type: object
      additionalProperties: false
      required: [accounts, browserSignIn]
      properties:
        accounts: { type: array, items: { $ref: "#/components/schemas/Account" } }
        browserSignIn:
          type: array
          description: Provider hosts where browser sign-in is available; other hosts sign in with an access token.
          items: { $ref: "#/components/schemas/BrowserSignInHost" }
    AiApiFormat:
      type: string
      enum: [openAiChatCompletions, openAiResponses, anthropicMessages]
      description: "Wire format: openAiChatCompletions posts to {baseUrl}/chat/completions, openAiResponses to {baseUrl}/responses, anthropicMessages to {baseUrl}/messages."
    AiProvider:
      type: object
      additionalProperties: false
      required: [id, name, apiFormat, baseUrl, model, maxOutputTokens, hasApiKey, isLocal]
      properties:
        id: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9_-]+$" }
        name: { type: string, minLength: 1, maxLength: 100 }
        apiFormat: { $ref: "#/components/schemas/AiApiFormat" }
        baseUrl: { type: string, maxLength: 2048 }
        model: { type: string, maxLength: 255 }
        maxOutputTokens: { type: [integer, "null"], minimum: 1, maximum: 1000000 }
        hasApiKey: { type: boolean, description: Presence only; the key is never returned. }
        isLocal: { type: boolean, description: The endpoint is a loopback address, so requests stay on this machine. }
    AiSettings:
      type: object
      additionalProperties: false
      required: [activeProviderId, providers, configPath]
      properties:
        activeProviderId: { type: [string, "null"], description: No active provider means AI assistance is off. }
        providers: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/AiProvider" } }
        configPath: { type: [string, "null"], description: Absolute path of ai-providers.json. }
    ConflictWindowAiSettings:
      type: object
      additionalProperties: false
      required: [activeProviderId, providers, configPath, promptInstructions]
      properties:
        activeProviderId: { type: [string, "null"], description: No active provider means AI assistance is off. }
        providers: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/AiProvider" } }
        configPath: { type: [string, "null"], description: Absolute path of ai-providers.json. }
        promptInstructions: { type: string, description: "The exact instructions that open every AI merge prompt; the operation, path and the BASE, OURS, THEIRS and CURRENT RESULT stages follow them." }
    AiProviderInput:
      type: object
      additionalProperties: false
      required: [id, name, apiFormat, baseUrl, model]
      properties:
        id: { type: string, minLength: 1, maxLength: 64, pattern: "^[A-Za-z0-9_-]+$" }
        name: { type: string, minLength: 1, maxLength: 100 }
        apiFormat: { $ref: "#/components/schemas/AiApiFormat" }
        baseUrl: { type: string, maxLength: 2048, description: HTTPS anywhere, or HTTP only to localhost/loopback; no credentials, query or fragment. }
        model: { type: string, minLength: 1, maxLength: 255 }
        maxOutputTokens: { type: [integer, "null"], minimum: 1, maximum: 1000000, description: "Sent as max_tokens (chat completions), max_output_tokens (responses) or max_tokens (Anthropic, default 4096)." }
        apiKey: { type: [string, "null"], maxLength: 4096, writeOnly: true, description: Absent or null keeps the key saved for this id; an empty string removes it. }
    AiSettingsRequest:
      type: object
      additionalProperties: false
      required: [providers]
      properties:
        activeProviderId: { type: [string, "null"] }
        providers: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/AiProviderInput" } }
    AiProviderTestRequest:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider: { $ref: "#/components/schemas/AiProviderInput" }
    AiProviderTestReply:
      type: object
      additionalProperties: false
      required: [model, response]
      properties:
        model: { type: string }
        response: { type: string, maxLength: 500 }
    AiRequest:
      type: object
      additionalProperties: false
      required: [prompt, files]
      properties:
        prompt: { type: string, minLength: 1, maxLength: 2048 }
        files:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/AiFileSelection" }
    AiFileSelection:
      type: object
      additionalProperties: false
      required: [path, scope, revision]
      properties:
        path: { type: string, minLength: 1, maxLength: 4096, description: Repository-relative path. }
        scope: { type: string, enum: [index, workingTree] }
        revision: { type: string, description: Exact revision returned by the local Diff API for this selected path/scope. }
        selections:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/DiffSelection" }
    AiReply:
      type: object
      additionalProperties: false
      required: [provider, apiFormat, model, response, files]
      properties:
        provider: { type: string, description: Display name of the provider that answered. }
        apiFormat: { $ref: "#/components/schemas/AiApiFormat" }
        model: { type: string }
        response: { type: string, maxLength: 1048576 }
        files: { type: array, items: { type: string } }
    DeleteBranchRequest:
      type: object
      additionalProperties: false
      required: [name, allowUnmerged]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        allowUnmerged: { type: boolean, description: Explicitly permit deletion when the preview reports commits not reachable from the current branch. }
    CopyableFiles:
      type: object
      additionalProperties: false
      required: [files, omittedCount]
      properties:
        files:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, sizeBytes]
            properties:
              path: { type: string }
              sizeBytes: { type: integer, minimum: 0 }
        omittedCount: { type: integer, minimum: 0, description: Ignored folders, large files and files beyond the listing limit that are not offered. }
    WorktreeFolderCheck:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok, notAbsolute, notEmpty, isFile] }
    AddWorktreeRequest:
      type: object
      additionalProperties: false
      required: [branch, path]
      properties:
        branch: { type: string, minLength: 1, maxLength: 255 }
        path: { type: string, minLength: 1, maxLength: 4096, description: Absolute path to a new or empty folder. }
        copyFiles: { type: array, maxItems: 100, items: { type: string, maxLength: 4096 }, description: Small Git-ignored files (from the local-files listing) to copy into the new worktree. }
        fromRemote: { type: boolean, description: "branch is a remote-tracking branch such as origin/feature; a local tracking branch is created in the worktree. Defaults to false." }
    RemoveWorktreeRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string, minLength: 1, maxLength: 4096 }
        force: { type: boolean, default: false }
        deleteBranch:
          type: boolean
          default: false
          description: Also delete the branch the worktree has checked out, after the folder is removed. The branch is checked first, so a refused deletion removes nothing.
        allowUnmerged:
          type: boolean
          default: false
          description: Lets deleteBranch remove a branch with commits not reachable from the current branch.
    WorktreeSnapshot:
      type: object
      additionalProperties: false
      required: [repoId, worktrees]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        worktrees:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, head, branch, detached, locked, prunable, isCurrent, isMain, isDirty]
            properties:
              path: { type: string }
              head: { type: [string, "null"] }
              branch: { type: [string, "null"] }
              detached: { type: boolean }
              locked: { type: boolean }
              prunable: { type: boolean }
              isCurrent: { type: boolean }
              isMain: { type: boolean }
              isDirty: { type: boolean }
    BranchDeletePreview:
      type: object
      additionalProperties: false
      required: [name, isCurrent, unmergedCommitCount, requiresConfirmation]
      properties:
        name: { type: string }
        isCurrent: { type: boolean }
        unmergedCommitCount: { type: integer, minimum: 0 }
        requiresConfirmation: { type: boolean }
    RemoteBranchDeletePreview:
      type: object
      additionalProperties: false
      required: [repoId, remoteName, remoteBranch, targetRef, expectedRemoteOid, currentHeadOid, commitsOnlyOnRemote, affectedPaths, omittedPathCount, operationInProgress, previewRevision, canDelete]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        remoteName: { type: string, minLength: 1, maxLength: 255 }
        remoteBranch: { type: string, minLength: 1, maxLength: 255 }
        targetRef: { type: string, pattern: "^refs/remotes/.+$" }
        expectedRemoteOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        currentHeadOid: { type: [string, "null"], minLength: 40, maxLength: 64 }
        commitsOnlyOnRemote: { type: integer, minimum: 0 }
        affectedPaths: { type: array, maxItems: 200, items: { type: string } }
        omittedPathCount: { type: integer, minimum: 0 }
        operationInProgress: { type: [string, "null"], enum: [merge, cherryPick, revert, rebase, shelfApply, null] }
        previewRevision: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        canDelete: { type: boolean }
    RemoteBranchDeleteRequest:
      type: object
      additionalProperties: false
      required: [remoteName, remoteBranch, expectedRemoteOid, previewRevision, confirmDelete]
      properties:
        remoteName: { type: string, minLength: 1, maxLength: 255 }
        remoteBranch: { type: string, minLength: 1, maxLength: 255 }
        expectedRemoteOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        previewRevision: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        confirmDelete: { type: boolean, description: Must be true after explicit user confirmation. }
    CommitRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          description: Commit message supplied to Git over standard input; its UTF-8 encoded size must not exceed 64 KiB.
        amend:
          type: boolean
          description: Replace the current HEAD commit while retaining its staged tree.
        signOff:
          type: boolean
          description: Add a Signed-off-by trailer for the configured Git identity.
        sign:
          type: boolean
          description: Sign the commit using the signing key configured in Git.
        selections:
          type: array
          maxItems: 512
          description: Optional staged diff selections; when present, only these staged rows are included in the commit.
          items:
            type: object
            additionalProperties: false
            required: [path, revision, selections]
            properties:
              path: { type: string, minLength: 1 }
              revision: { type: string, minLength: 1 }
              selections:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [hunkIndex]
                  properties:
                    hunkIndex: { type: integer, minimum: 0 }
                    rowIndex: { type: integer, minimum: 0 }
                    side: { type: string, enum: [old, new], description: "With rowIndex, selects only the deleted (old) or added (new) line of a row that has both." }
    StagingPatchRequest:
      type: object
      additionalProperties: false
      required: [action, path, scope, revision, selections]
      properties:
        action:
          type: string
          enum: [stage, unstage]
        path:
          type: string
          minLength: 1
        scope:
          type: string
          enum: [workingTree, index]
        revision:
          type: string
          minLength: 1
        selections:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [hunkIndex]
            properties:
              hunkIndex:
                type: integer
                minimum: 0
              rowIndex:
                type: integer
                minimum: 0
              side:
                type: string
                enum: [old, new]
                description: With rowIndex, selects only the deleted (old) or added (new) line of a row that has both.
    DiscardPatchRequest:
      type: object
      additionalProperties: false
      required: [path, revision, selections, confirmDiscard]
      properties:
        path:
          type: string
          minLength: 1
        revision:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        selections:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: "#/components/schemas/DiffSelection"
        confirmDiscard:
          type: boolean
          description: Must be true after the user reviews the selected working-tree changes.
    ShelfCreateRequest:
      type: object
      additionalProperties: false
      required: [name, description, expectedHeadOid, items]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 500
        expectedHeadOid:
          type: string
          nullable: true
          pattern: "^(?:[a-fA-F0-9]{40}|[a-fA-F0-9]{64})$"
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ShelfSelection"
    ShelfSelection:
      type: object
      additionalProperties: false
      required: [path, scope, revision]
      properties:
        path:
          type: string
          minLength: 1
        scope:
          type: string
          enum: [workingTree, index]
        revision:
          type: string
          minLength: 1
        selections:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/DiffSelection"
    DiffSelection:
      type: object
      additionalProperties: false
      required: [hunkIndex]
      properties:
        hunkIndex:
          type: integer
          minimum: 0
        rowIndex:
          type: integer
          minimum: 0
        side:
          type: string
          enum: [old, new]
          description: With rowIndex, selects only the deleted (old) or added (new) line of a row that has both.
    Shelf:
      type: object
      additionalProperties: false
      required: [shelfId, repoId, name, description, paths, scope, headOid, createdAtMs]
      properties:
        shelfId:
          type: string
          minLength: 1
          maxLength: 128
        repoId:
          $ref: "#/components/schemas/RepoId"
        name:
          type: string
        description:
          type: string
        paths:
          type: array
          items:
            type: string
        scope:
          type: string
          nullable: true
          enum: [workingTree, index]
          description: Null only for shelves created before scope metadata was introduced; those entries cannot be applied automatically.
        headOid:
          type: string
          nullable: true
        createdAtMs:
          type: integer
          format: int64
    ShelfDetail:
      type: object
      additionalProperties: false
      required: [shelf, patch]
      properties:
        shelf:
          $ref: "#/components/schemas/Shelf"
        patch:
          type: string
          description: Unified diff patch stored with this shelf; reading it never applies it.
    ShelfApplyRequest:
      type: object
      additionalProperties: false
      required: [expectedHeadOid, previewRevision]
      properties:
        expectedHeadOid:
          type: string
          nullable: true
          pattern: "^(?:[a-fA-F0-9]{40}|[a-fA-F0-9]{64})$"
        previewRevision:
          type: string
          minLength: 1
    ShelfApplyPreview:
      type: object
      additionalProperties: false
      required: [shelf, expectedHeadOid, previewRevision, canApplyCleanly, canApplyWithConflicts]
      properties:
        shelf:
          $ref: "#/components/schemas/Shelf"
        expectedHeadOid:
          type: string
          nullable: true
        previewRevision:
          type: string
          minLength: 1
        canApplyCleanly:
          type: boolean
        canApplyWithConflicts:
          type: boolean
    OpenRepositoryRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          description: Local folder explicitly selected by the user.
    TaskStatus:
      type: string
      enum: [queued, running, waitingForInput, succeeded, failed, cancelled]
    TaskSnapshot:
      type: object
      additionalProperties: false
      required: [taskId, repoId, targetPath, resultRepoId, operation, status, phase, progress, message, errorCategory, logs, createdAtMs, updatedAtMs, cancelRequested]
      properties:
        taskId:
          type: string
        repoId:
          oneOf:
            - $ref: "#/components/schemas/RepoId"
            - type: "null"
        targetPath:
          type: [string, "null"]
        resultRepoId:
          oneOf:
            - $ref: "#/components/schemas/RepoId"
            - type: "null"
        operation:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        phase:
          type: string
        progress:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        message:
          type: [string, "null"]
        errorCategory:
          oneOf:
            - type: string
              enum: [authentication, network, gitUnavailable, commandFailed, pushRejected, outcomeUnknown]
            - type: "null"
        logs:
          type: array
          items:
            type: string
        createdAtMs:
          type: integer
          format: int64
        updatedAtMs:
          type: integer
          format: int64
        cancelRequested:
          type: boolean
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [eventId, protocolVersion, type, occurredAtMs, payload]
      properties:
        eventId:
          type: string
          description: Starts at 1 and increases for events delivered on this connection; gaps require a full resync and are not durable cursors.
        protocolVersion:
          type: integer
          const: 1
        repoId:
          $ref: "#/components/schemas/RepoId"
        type:
          type: string
          enum:
            - repository.updated
            - status.changed
            - log.refsChanged
            - task.started
            - task.progress
            - task.completed
            - task.failed
            - pipeline.run.updated
            - pipeline.trigger.pending
            - connection.resyncRequired
        occurredAtMs:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds.
        payload:
          type: object
          additionalProperties: true
    ApiErrorCode:
      type: string
      enum:
        - AUTH_UNAUTHORIZED
        - AUTH_FORBIDDEN
        - API_VERSION_UNSUPPORTED
        - API_ROUTE_NOT_FOUND
        - REPOSITORY_NOT_FOUND
        - REPOSITORY_PATH_NOT_FOUND
        - REPOSITORY_ACCESS_DENIED
        - NOT_A_REPOSITORY
        - REPOSITORY_ALREADY_INITIALIZED
        - REPOSITORY_INITIALIZATION_FAILED
        - DATABASE_UNAVAILABLE
        - REPOSITORY_STATUS_FAILED
        - TASK_NOT_FOUND
        - SHELF_NOT_FOUND
        - TASK_QUEUE_FULL
        - TASK_SERVICE_STOPPING
        - GIT_UNAVAILABLE
        - REPOSITORY_STATE_CONFLICT
        - RESOURCE_VERSION_STALE
        - REQUEST_INVALID
        - COMMIT_CONFLICT
        - COMMIT_MESSAGE_TOO_LARGE
        - HISTORY_COMMIT_NOT_FOUND
        - HISTORY_UNAVAILABLE
        - HISTORY_TOO_LARGE
        - BRANCHES_UNAVAILABLE
        - BRANCHES_TOO_LARGE
        - BRANCH_NAME_INVALID
        - BRANCH_ALREADY_EXISTS
        - BRANCH_REQUIRES_COMMIT
        - BRANCH_NOT_FOUND
        - BRANCH_CURRENT
        - BRANCH_UNMERGED
        - BRANCH_WORKTREE_DIRTY
        - REMOTES_UNAVAILABLE
        - REMOTES_TOO_LARGE
        - REMOTE_NAME_INVALID
        - REMOTE_URL_INVALID
        - REMOTE_ALREADY_EXISTS
        - REMOTE_NOT_FOUND
        - CREDENTIAL_INPUT_INVALID
        - CREDENTIALS_UNAVAILABLE
        - IDENTITY_UNAVAILABLE
        - TAG_NOT_FOUND
        - STASH_NOT_FOUND
        - ACCOUNT_INPUT_INVALID
        - ACCOUNT_NOT_FOUND
        - ACCOUNT_TOKEN_REJECTED
        - ACCOUNT_PROVIDER_UNREACHABLE
        - ACCOUNT_PROVIDER_NOT_CONFIGURED
        - ACCOUNT_FLOW_NOT_FOUND
        - ACCOUNT_SIGN_IN_REJECTED
        - PULL_PREFLIGHT_UNAVAILABLE
        - PULL_TARGET_UNAVAILABLE
        - PULL_PREFLIGHT_STALE
        - PULL_REQUIRES_CLEAN
        - PUSH_PREFLIGHT_UNAVAILABLE
        - PUSH_TARGET_UNAVAILABLE
