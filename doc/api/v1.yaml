openapi: 3.1.0
info:
  title: GitCrest Local API
  version: 1.0.0
  description: >-
    Versioned local API for the GitCrest Electron renderer and its read-only windows.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "49152"
security:
  - sessionBearer: []
paths:
  /health:
    get:
      operationId: health
      security: []
      summary: Process liveness probe
      responses:
        "204":
          description: The sidecar is alive. The response has no body or session data.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
  /api/version:
    get:
      operationId: getVersion
      summary: Get the engine and API compatibility versions
      responses:
        "200":
          description: Version information
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
              example:
                name: gitcrest-core
                version: 0.1.0
                apiVersion: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/repositories/initialize:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: initializeRepository
      summary: Initialize a user-selected folder as a new Git repository
      description: Refuses folders already inside a Git working tree and preserves existing files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenRepositoryRequest"
      responses:
        "200":
          description: The selected folder was initialized and registered.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          description: Missing or malformed repository path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The selected path cannot be written by GitCrest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: The selected path does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: The selected folder is already part of a Git working tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Git could not initialize the selected folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The Git executable could not be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    get:
      operationId: getRepository
      summary: Open a registered repository by opaque ID and update its last accessed time
      parameters:
        - name: repoId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RepoId"
      responses:
        "200":
          description: Repository state
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The repository ID is not registered in this session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                error:
                  code: REPOSITORY_NOT_FOUND
                  message: Repository was not found in this session.
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
    delete:
      operationId: forgetRepository
      summary: Remove an entry from the recent repository list
      responses:
        "204":
          description: The repository entry was removed. Git files are untouched.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No matching repository entry exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
  /api/v1/repositories/{repoId}/favorite:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    put:
      operationId: setRepositoryFavorite
      summary: Set the favorite state for a recent repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [favorite]
              properties:
                favorite:
                  type: boolean
      responses:
        "200":
          description: Updated repository entry.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No matching repository entry exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
  /api/v1/repositories/{repoId}/status:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    get:
      operationId: getRepositoryStatus
      summary: Refresh and read the complete working tree status snapshot
      responses:
        "200":
          description: Current staged, unstaged, untracked, ignored, and conflicted file status.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The repository is not registered or its path is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "500":
          description: Git could not read repository status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The Git executable could not be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/diff:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    get:
      operationId: getRepositoryFileDiff
      summary: Read a changed file as a bounded structured split diff
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [workingTree, index]
      responses:
        "200":
          description: Text hunks, binary state, or an explicit unsupported content state.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffDocument"
        "400":
          description: The path or scope is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: GitCrest cannot read the selected file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: The repository or changed path no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "413":
          description: The structured diff exceeds 10 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "504":
          description: Git did not produce the diff within the bounded query deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          description: Git returned an unexpected diff error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The Git executable could not be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/blame:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
      - name: path
        in: query
        required: true
        schema: { type: string, minLength: 1, maxLength: 4096 }
      - name: revision
        in: query
        required: false
        description: Full commit object ID. When omitted, blame uses HEAD.
        schema: { type: string, pattern: "^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$" }
    get:
      operationId: getRepositoryBlame
      summary: Read line blame attribution for a tracked file
      responses:
        "200":
          description: Per-line commit, author, source line, and text attribution.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlameDocument"
        "400":
          description: The path or full commit ID is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository or requested revision is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "413":
          description: Blame output exceeds the bounded response size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "504":
          description: Git blame exceeded its query deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/branches:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    get:
      operationId: getRepositoryBranches
      summary: Read local and remote branches with upstream tracking state
      responses:
        "200":
          description: Branch refs and current ahead/behind counts from local Git refs.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "413":
          description: Branch data exceeds the bounded response size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "504":
          description: Git branch enumeration exceeded its deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    post:
      operationId: createRepositoryBranch
      summary: Queue creation of a local branch at the current HEAD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchRequest"
      responses:
        "202":
          description: Branch creation task accepted.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: Branch name is invalid or request body is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: Repository has no commits or the local branch name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Git or task storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/branches/rename:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: renameRepositoryBranch
      summary: Queue a local branch rename
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameBranchRequest" }
      responses:
        "202":
          description: Rename task accepted.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository or source branch is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "409":
          description: A local branch already uses the requested name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
  /api/v1/repositories/{repoId}/branches/favorite:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    put:
      operationId: setRepositoryBranchFavorite
      summary: Persist a branch ref favorite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchFavoriteRequest" }
      responses:
        "200":
          description: Current branch snapshot with the updated favorite state.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository or branch ref is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/branches/delete-preview:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: previewRepositoryBranchDelete
      summary: Count branch commits not reachable from the current branch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchNameRequest" }
      responses:
        "200":
          description: Delete impact preview.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchDeletePreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository or local branch is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/branches/delete:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: deleteRepositoryBranch
      summary: Queue guarded deletion of a local branch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteBranchRequest" }
      responses:
        "202":
          description: Delete task accepted.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository or local branch is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "409":
          description: The branch is current, or unmerged commits need explicit confirmation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
  /api/v1/repositories:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    get:
      operationId: listRepositories
      summary: List recent repositories saved on this device
      responses:
        "200":
          description: The complete repository list, ordered favorites first and then by last accessed time.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repository"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
    post:
      operationId: openRepository
      summary: Validate and register a user-selected local Git working tree
      description: The path is accepted only for this open operation. Subsequent repository operations use repoId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenRepositoryRequest"
      responses:
        "200":
          description: Repository opened or already registered in this session.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          description: Missing or malformed repository path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The selected path cannot be read by GitCrest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: The selected path does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "422":
          description: The selected folder is not a Git working tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The Git executable could not be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/clones:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: cloneRepository
      summary: Queue a clone into a user-selected parent folder
      description: Clones to a private staging folder and registers the repository only after a successful move.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [remoteUrl, parentPath, directoryName]
              properties:
                remoteUrl: { type: string, minLength: 1, maxLength: 2048 }
                parentPath: { type: string, minLength: 1 }
                directoryName: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "202":
          description: Clone task accepted.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: Remote or destination is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: Destination already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The bounded task queue is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/events:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    get:
      operationId: subscribeToEvents
      summary: Subscribe to versioned repository and task events over WebSocket
      description: See events-v1.md for handshake and reconnect rules.
      x-websocket: true
      responses:
        "101":
          description: WebSocket upgraded. The authorization header is mandatory.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
  /api/v1/tasks:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    get:
      operationId: listTasks
      summary: List the bounded task history for this sidecar session
      responses:
        "200":
          description: Current and recently completed background tasks.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
  /api/v1/repositories/{repoId}/staging:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    post:
      operationId: stageRepositoryChanges
      summary: Queue file-level or all-file stage and unstage work
      description: File operations require a path from the latest repository status snapshot. Conflicted and ignored files cannot be staged through this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StagingRequest"
      responses:
        "202":
          description: Staging task accepted and durably recorded before execution.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: The action or path is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The repository or selected changed path is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: The file state changed or a conflict must be resolved first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Git, task capacity, or task storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/staging/patch:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    post:
      operationId: stageSelectedDiffHunks
      summary: Queue a revision-checked hunk staging or unstaging task
      description: The request selects hunks or change rows from the current structured diff. The revision is checked again after the repository write lock is acquired.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StagingPatchRequest"
      responses:
        "202":
          description: Partial staging task accepted and durably recorded.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: The hunk selection is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The repository or selected file is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: The selected diff revision expired or the repository has a conflicting state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Git, task capacity, or task storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/commits:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    get:
      operationId: listRepositoryCommits
      summary: Read a bounded page of commits from HEAD and branch refs with optional filters
      parameters:
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: sha
          in: query
          required: false
          description: Full or unambiguous hexadecimal commit ID or prefix.
          schema: { type: string, minLength: 4, maxLength: 64, pattern: "^[a-fA-F0-9]+$" }
        - name: author
          in: query
          required: false
          description: Literal, case-insensitive author name or email substring.
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: message
          in: query
          required: false
          description: Literal, case-insensitive substring of the commit message.
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: branch
          in: query
          required: false
          description: Exact short name of a local or remote branch.
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: path
          in: query
          required: false
          description: Exact repository-relative path changed by the commit.
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: since
          in: query
          required: false
          description: Include commits on or after this calendar date (UTC).
          schema: { type: string, format: date }
        - name: until
          in: query
          required: false
          description: Include commits on or before this calendar date (UTC).
          schema: { type: string, format: date }
      responses:
        "200":
          description: Bounded commit page in topological order. Tags are excluded from the initial walk.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitPage"
        "400":
          description: Offset, page size, or one of the filters is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository is not registered or its path is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "413":
          description: History output exceeds the bounded response size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "504":
          description: Git history read exceeded its deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    post:
      operationId: commitRepository
      summary: Queue a commit from the staged changes
      description: Commit writes the message through standard input, checks staged changes after acquiring the repository task lock, and refreshes repository metadata after execution. Optional row selections are applied to a temporary index based on HEAD; the repository index is left intact so unselected staged changes remain staged on success, hook failure, and cancellation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRequest"
      responses:
        "202":
          description: Commit task accepted and durably recorded.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: Commit message is empty, malformed, or contains NUL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository is not registered or its path is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: No staged changes remain, unresolved conflicts exist, amend has no HEAD, or the selected diff revision is stale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "413":
          description: Commit message exceeds 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Git, task capacity, or task storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/commits/{oid}:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
      - name: oid
        in: path
        required: true
        schema:
          type: string
          pattern: "^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$"
    get:
      operationId: getRepositoryCommit
      summary: Read one commit and its file statistics
      responses:
        "200":
          description: Commit details relative to the first parent, or the empty tree for a root commit.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitDetail"
        "400":
          description: Commit object ID is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository or commit object is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "413":
          description: Commit details exceed the bounded response size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/commits/{oid}/diff:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
      - name: oid
        in: path
        required: true
        schema: { type: string, pattern: "^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$" }
      - name: path
        in: query
        required: true
        schema: { type: string, minLength: 1, maxLength: 4096 }
    get:
      operationId: getRepositoryCommitDiff
      summary: Read a commit file diff against its first parent
      responses:
        "200":
          description: Read-only file diff for the selected commit.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffDocument"
        "400":
          description: Commit ID or repository-relative path is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository, commit, or changed path is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "413":
          description: Diff exceeds the bounded response size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "504":
          description: Git diff exceeded its deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/commits/{oid}/tags:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
      - name: oid
        in: path
        required: true
        schema: { type: string, pattern: "^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$" }
    post:
      operationId: createRepositoryCommitTag
      summary: Create a new annotated tag for a commit
      description: Existing tag refs are never replaced. The tag name must pass Git ref validation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
      responses:
        "201":
          description: Annotated tag created for the selected commit.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedTag"
        "400":
          description: Tag name, commit ID, or annotation is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository or commit is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: A tag with the same name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Git could not be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "504":
          description: Git tag creation exceeded its deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/refs:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    get:
      operationId: listRepositoryRefs
      summary: Read HEAD and local or remote branch refs
      description: Tags are excluded to keep the initial ref snapshot bounded for repositories with many tags.
      responses:
        "200":
          description: Current HEAD and branch refs.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository is not registered or its path is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "413":
          description: Ref output exceeds the bounded response size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/fetch:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    post:
      operationId: fetchRepository
      summary: Queue a fetch task for a registered repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [prune]
              properties:
                prune:
                  type: boolean
      responses:
        "202":
          description: Fetch task accepted and durably recorded before execution.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: Fetch options are malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The repository is not registered or no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "503":
          description: The task queue is full or Git cannot be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: taskId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTask
      summary: Read a task and its sanitized logs
      responses:
        "200":
          description: Task state.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The task is not retained in this sidecar session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
  /api/v1/tasks/{taskId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: taskId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: cancelTask
      summary: Request cooperative cancellation of a task
      description: Cancellation is an intent. A running task becomes cancelled only after its operation reaches a safe stop point.
      responses:
        "200":
          description: The latest task state after recording the cancellation request.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The task is not retained in this sidecar session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
components:
  securitySchemes:
    sessionBearer:
      type: http
      scheme: bearer
      bearerFormat: session token
  headers:
    ApiVersion:
      description: Major API contract version used by this response.
      schema:
        type: string
        const: "1"
  responses:
    BadRequest:
      description: The request body or branch name is invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Unauthorized:
      description: Missing or invalid session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              code: AUTH_UNAUTHORIZED
              message: A valid session bearer token is required.
    Forbidden:
      description: The caller is authenticated but does not have the requested window capability.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              code: AUTH_FORBIDDEN
              message: This window has read-only access.
    UnsupportedVersion:
      description: The requested API major version is not supported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              code: API_VERSION_UNSUPPORTED
              message: The requested API major version is not supported.
    StateConflict:
      description: The operation conflicts with the repository's current Git state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              code: REPOSITORY_STATE_CONFLICT
              message: A merge is already in progress.
    StaleResource:
      description: The supplied resource version or precondition has expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              code: RESOURCE_VERSION_STALE
              message: The resource changed since it was read. Refresh and retry.
  parameters:
    ApiVersion:
      name: X-GitCrest-API-Version
      in: header
      required: true
      schema:
        type: string
        const: "1"
  schemas:
    RepoId:
      type: string
      minLength: 1
      maxLength: 128
      description: Opaque, stable ID assigned by RepositoryManager; never a filesystem path.
      example: repo_01J9M6G3C4Y4Y2B8YH7AKQ2K8N
    VersionResponse:
      type: object
      additionalProperties: false
      required: [name, version, apiVersion]
      properties:
        name:
          type: string
        version:
          type: string
        apiVersion:
          type: integer
          const: 1
    Repository:
      type: object
      additionalProperties: false
      required: [repoId, path, head, branch, detached, state, isFavorite, lastAccessedAt, availability]
      properties:
        repoId:
          $ref: "#/components/schemas/RepoId"
        path:
          type: string
        head:
          type: [string, "null"]
        branch:
          type: [string, "null"]
        detached:
          type: boolean
        state:
          type: string
          enum: [normal, merging, rebasing, cherryPicking, bisecting]
        isFavorite:
          type: boolean
        lastAccessedAt:
          type: integer
          format: int64
          minimum: 0
        availability:
          type: string
          enum: [available, missing]
    StatusSnapshot:
      type: object
      additionalProperties: false
      required: [repoId, refreshedAtMs, files]
      properties:
        repoId:
          $ref: "#/components/schemas/RepoId"
        refreshedAtMs:
          type: integer
          format: int64
          minimum: 0
        files:
          type: array
          items:
            $ref: "#/components/schemas/StatusFile"
    StatusFile:
      type: object
      additionalProperties: false
      required: [path, indexStatus, worktreeStatus, kind, categories, modeChanged]
      properties:
        path:
          type: string
        originalPath:
          type: string
        indexStatus:
          type: string
          minLength: 1
          maxLength: 1
        worktreeStatus:
          type: string
          minLength: 1
          maxLength: 1
        kind:
          type: string
          enum: [modified, added, deleted, renamed, copied, typeChanged, untracked, ignored, conflicted]
        categories:
          type: array
          items:
            type: string
            enum: [staged, unstaged, untracked, ignored, conflicted]
        modeChanged:
          type: boolean
    DiffDocument:
      type: object
      additionalProperties: false
      required: [repoId, path, revision, originalPath, scope, changeKind, status, hunks]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        path: { type: string }
        revision: { type: string, minLength: 1 }
        originalPath: { type: [string, "null"] }
        scope: { type: string, enum: [workingTree, index, commit] }
        changeKind: { type: string, enum: [modified, added, deleted, renamed, copied, typeChanged, untracked, ignored, conflicted] }
        status: { type: string, enum: [text, binary, empty, conflicted, ignored, symlink, submodule] }
        hunks:
          type: array
          items: { $ref: "#/components/schemas/DiffHunk" }
    BlameDocument:
      type: object
      additionalProperties: false
      required: [repoId, path, revision, lines]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        path: { type: string }
        revision: { type: [string, "null"] }
        lines:
          type: array
          items: { $ref: "#/components/schemas/BlameLine" }
    BlameLine:
      type: object
      additionalProperties: false
      required: [lineNumber, originalLineNumber, commitOid, authorName, authorEmail, committedAtMs, summary, text]
      properties:
        lineNumber: { type: integer, minimum: 1 }
        originalLineNumber: { type: integer, minimum: 1 }
        commitOid: { type: string, pattern: "^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$" }
        authorName: { type: string }
        authorEmail: { type: string }
        committedAtMs: { type: integer, format: int64 }
        summary: { type: string }
        text: { type: string }
    DiffHunk:
      type: object
      additionalProperties: false
      required: [oldStart, oldLines, newStart, newLines, rows]
      properties:
        oldStart: { type: integer, minimum: 0 }
        oldLines: { type: integer, minimum: 0 }
        newStart: { type: integer, minimum: 0 }
        newLines: { type: integer, minimum: 0 }
        rows:
          type: array
          items: { $ref: "#/components/schemas/DiffRow" }
    DiffRow:
      type: object
      additionalProperties: false
      required: [kind, oldLine, newLine, oldText, newText]
      properties:
        kind: { type: string, enum: [context, change] }
        oldLine: { type: [integer, "null"], minimum: 0 }
        newLine: { type: [integer, "null"], minimum: 0 }
        oldText: { type: [string, "null"] }
        newText: { type: [string, "null"] }
    StagingRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [stageFile, unstageFile, stageAll, unstageAll]
        path:
          type: string
          minLength: 1
          description: Repository-relative path, required for file actions and forbidden for all-file actions.
    CommitPage:
      type: object
      additionalProperties: false
      required: [repoId, offset, limit, commits, nextOffset]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        commits:
          type: array
          items: { $ref: "#/components/schemas/CommitSummary" }
        nextOffset: { type: [integer, "null"], minimum: 0 }
    CommitSummary:
      type: object
      additionalProperties: false
      required: [oid, parents, authorName, authorEmail, committedAtMs, subject]
      properties:
        oid: { type: string, pattern: "^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$" }
        parents:
          type: array
          items: { type: string }
        authorName: { type: string }
        authorEmail: { type: string }
        committedAtMs: { type: integer, format: int64 }
        subject: { type: string }
    CommitDetail:
      type: object
      additionalProperties: false
      required: [repoId, oid, parents, authorName, authorEmail, committedAtMs, message, stats, files]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        oid: { type: string }
        parents:
          type: array
          items: { type: string }
        authorName: { type: string }
        authorEmail: { type: string }
        committedAtMs: { type: integer, format: int64 }
        message: { type: string }
        stats: { $ref: "#/components/schemas/CommitStats" }
        files:
          type: array
          items: { $ref: "#/components/schemas/CommitFileStat" }
    CommitStats:
      type: object
      additionalProperties: false
      required: [filesChanged, insertions, deletions]
      properties:
        filesChanged: { type: integer, minimum: 0 }
        insertions: { type: integer, format: int64, minimum: 0 }
        deletions: { type: integer, format: int64, minimum: 0 }
    CommitFileStat:
      type: object
      additionalProperties: false
      required: [path, additions, deletions]
      properties:
        path: { type: string }
        additions: { type: [integer, "null"], format: int64, minimum: 0, description: Null for binary content. }
        deletions: { type: [integer, "null"], format: int64, minimum: 0, description: Null for binary content. }
    CreateTagRequest:
      type: object
      additionalProperties: false
      required: [name, message]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        message: { type: string, maxLength: 8192, description: Optional annotation body; an empty message is permitted. }
    CreatedTag:
      type: object
      additionalProperties: false
      required: [repoId, name, fullName, oid]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        name: { type: string }
        fullName: { type: string }
        oid: { type: string, pattern: "^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$" }
    RefSnapshot:
      type: object
      additionalProperties: false
      required: [repoId, head, branch, detached, refs]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        head: { type: [string, "null"] }
        branch: { type: [string, "null"] }
        detached: { type: boolean }
        refs:
          type: array
          items: { $ref: "#/components/schemas/RepositoryRef" }
    RepositoryRef:
      type: object
      additionalProperties: false
      required: [name, fullName, oid, kind, upstream]
      properties:
        name: { type: string }
        fullName: { type: string }
        oid: { type: string }
        kind: { type: string, enum: [local, remote] }
        upstream: { type: [string, "null"] }
    BranchSnapshot:
      type: object
      additionalProperties: false
      required: [repoId, current, detached, branches]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        current: { type: [string, "null"] }
        detached: { type: boolean }
        branches:
          type: array
          items: { $ref: "#/components/schemas/BranchRef" }
    BranchRef:
      type: object
      additionalProperties: false
      required: [name, fullName, oid, kind, isCurrent, isFavorite, upstream, upstreamGone, ahead, behind]
      properties:
        name: { type: string }
        fullName: { type: string }
        oid: { type: string, pattern: "^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$" }
        kind: { type: string, enum: [local, remote] }
        isCurrent: { type: boolean }
        isFavorite: { type: boolean }
        upstream: { type: [string, "null"] }
        upstreamGone: { type: boolean }
        ahead: { type: [integer, "null"], minimum: 0 }
        behind: { type: [integer, "null"], minimum: 0 }
    CreateBranchRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
    RenameBranchRequest:
      type: object
      additionalProperties: false
      required: [name, newName]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        newName: { type: string, minLength: 1, maxLength: 255 }
    BranchNameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
    BranchFavoriteRequest:
      type: object
      additionalProperties: false
      required: [fullName, favorite]
      properties:
        fullName: { type: string, minLength: 1 }
        favorite: { type: boolean }
    DeleteBranchRequest:
      type: object
      additionalProperties: false
      required: [name, allowUnmerged]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        allowUnmerged: { type: boolean, description: Explicitly permit deletion when the preview reports commits not reachable from the current branch. }
    BranchDeletePreview:
      type: object
      additionalProperties: false
      required: [name, isCurrent, unmergedCommitCount, requiresConfirmation]
      properties:
        name: { type: string }
        isCurrent: { type: boolean }
        unmergedCommitCount: { type: integer, minimum: 0 }
        requiresConfirmation: { type: boolean }
    CommitRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          description: Commit message supplied to Git over standard input; its UTF-8 encoded size must not exceed 64 KiB.
        amend:
          type: boolean
          description: Replace the current HEAD commit while retaining its staged tree.
        signOff:
          type: boolean
          description: Add a Signed-off-by trailer for the configured Git identity.
        sign:
          type: boolean
          description: Sign the commit using the signing key configured in Git.
        selections:
          type: array
          maxItems: 512
          description: Optional staged diff selections; when present, only these staged rows are included in the commit.
          items:
            type: object
            additionalProperties: false
            required: [path, revision, selections]
            properties:
              path: { type: string, minLength: 1 }
              revision: { type: string, minLength: 1 }
              selections:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [hunkIndex]
                  properties:
                    hunkIndex: { type: integer, minimum: 0 }
                    rowIndex: { type: integer, minimum: 0 }
    StagingPatchRequest:
      type: object
      additionalProperties: false
      required: [action, path, scope, revision, selections]
      properties:
        action:
          type: string
          enum: [stage, unstage]
        path:
          type: string
          minLength: 1
        scope:
          type: string
          enum: [workingTree, index]
        revision:
          type: string
          minLength: 1
        selections:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [hunkIndex]
            properties:
              hunkIndex:
                type: integer
                minimum: 0
              rowIndex:
                type: integer
                minimum: 0
    OpenRepositoryRequest:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
          minLength: 1
          description: Local folder explicitly selected by the user.
    TaskStatus:
      type: string
      enum: [queued, running, waitingForInput, succeeded, failed, cancelled]
    TaskSnapshot:
      type: object
      additionalProperties: false
      required: [taskId, repoId, targetPath, resultRepoId, operation, status, phase, progress, message, errorCategory, logs, createdAtMs, updatedAtMs, cancelRequested]
      properties:
        taskId:
          type: string
        repoId:
          oneOf:
            - $ref: "#/components/schemas/RepoId"
            - type: "null"
        targetPath:
          type: [string, "null"]
        resultRepoId:
          oneOf:
            - $ref: "#/components/schemas/RepoId"
            - type: "null"
        operation:
          type: string
        status:
          $ref: "#/components/schemas/TaskStatus"
        phase:
          type: string
        progress:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        message:
          type: [string, "null"]
        errorCategory:
          oneOf:
            - type: string
              enum: [authentication, network, gitUnavailable, commandFailed, outcomeUnknown]
            - type: "null"
        logs:
          type: array
          items:
            type: string
        createdAtMs:
          type: integer
          format: int64
        updatedAtMs:
          type: integer
          format: int64
        cancelRequested:
          type: boolean
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [eventId, protocolVersion, type, occurredAtMs, payload]
      properties:
        eventId:
          type: string
          description: Monotonic within a sidecar session; not a durable cursor.
        protocolVersion:
          type: integer
          const: 1
        repoId:
          $ref: "#/components/schemas/RepoId"
        type:
          type: string
          enum:
            - repository.updated
            - status.changed
            - log.refsChanged
            - task.started
            - task.progress
            - task.completed
            - task.failed
            - connection.resyncRequired
        occurredAtMs:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds.
        payload:
          type: object
          additionalProperties: true
    ApiErrorCode:
      type: string
      enum:
        - AUTH_UNAUTHORIZED
        - AUTH_FORBIDDEN
        - API_VERSION_UNSUPPORTED
        - API_ROUTE_NOT_FOUND
        - REPOSITORY_NOT_FOUND
        - REPOSITORY_PATH_NOT_FOUND
        - REPOSITORY_ACCESS_DENIED
        - NOT_A_REPOSITORY
        - REPOSITORY_ALREADY_INITIALIZED
        - REPOSITORY_INITIALIZATION_FAILED
        - DATABASE_UNAVAILABLE
        - REPOSITORY_STATUS_FAILED
        - TASK_NOT_FOUND
        - TASK_QUEUE_FULL
        - GIT_UNAVAILABLE
        - REPOSITORY_STATE_CONFLICT
        - RESOURCE_VERSION_STALE
        - REQUEST_INVALID
        - COMMIT_CONFLICT
        - COMMIT_MESSAGE_TOO_LARGE
        - HISTORY_COMMIT_NOT_FOUND
        - HISTORY_UNAVAILABLE
        - HISTORY_TOO_LARGE
        - BRANCHES_UNAVAILABLE
        - BRANCHES_TOO_LARGE
        - BRANCH_NAME_INVALID
        - BRANCH_ALREADY_EXISTS
        - BRANCH_REQUIRES_COMMIT
        - TAG_ALREADY_EXISTS
        - INTERNAL_ERROR
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ApiErrorCode"
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ApiErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
