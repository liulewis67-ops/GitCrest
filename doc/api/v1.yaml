        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The repository or remote is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "503": { description: The remote could not be reached., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/tags/push:
