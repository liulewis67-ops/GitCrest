openapi: 3.1.0
info:
  title: GitCrest Local API
  version: 1.0.0
  description: >-
    Versioned local API for the GitCrest Electron renderer and its read-only windows.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "49152"
security:
  - sessionBearer: []
paths:
  /health:
    get:
      operationId: health
      security: []
      summary: Process liveness probe
      responses:
        "204":
          description: The sidecar is alive. The response has no body or session data.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
  /api/version:
    get:
      operationId: getVersion
      summary: Get the engine and API compatibility versions
      responses:
        "200":
          description: Version information
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
              example:
                name: gitcrest-core
                version: 0.1.0
                apiVersion: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/repositories/initialize:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: initializeRepository
      summary: Initialize a user-selected folder as a new Git repository
      description: Refuses folders already inside a Git working tree and preserves existing files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenRepositoryRequest"
      responses:
        "200":
          description: The selected folder was initialized and registered.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          description: Missing or malformed repository path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The selected path cannot be written by GitCrest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: The selected path does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: The selected folder is already part of a Git working tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "422":
          description: Git could not initialize the selected folder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The Git executable could not be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    get:
      operationId: getRepository
      summary: Open a registered repository by opaque ID and update its last accessed time
      parameters:
        - name: repoId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/RepoId"
      responses:
        "200":
          description: Repository state
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The repository ID is not registered in this session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
              example:
                error:
                  code: REPOSITORY_NOT_FOUND
                  message: Repository was not found in this session.
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
    delete:
      operationId: forgetRepository
      summary: Remove an entry from the recent repository list
      responses:
        "204":
          description: The repository entry was removed. Git files are untouched.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No matching repository entry exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
  /api/v1/repositories/{repoId}/favorite:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    put:
      operationId: setRepositoryFavorite
      summary: Set the favorite state for a recent repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [favorite]
              properties:
                favorite:
                  type: boolean
      responses:
        "200":
          description: Updated repository entry.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No matching repository entry exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
  /api/v1/repositories/{repoId}/status:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    get:
      operationId: getRepositoryStatus
      summary: Read the working tree status snapshot or a bounded path scope
      description: Omitting paths returns the current snapshot, using the watcher-invalidated cache when available. Set refresh=true to force a fresh Git read. Repeating paths returns only status records matching those literal relative paths; use this form only for a reviewed watcher dirty scope and merge it into the previously read complete snapshot. Forced refresh cannot be combined with paths.
      parameters:
        - name: paths
          in: query
          required: false
          description: Repeated literal repository-relative path scopes. Up to 256 paths and 64 KiB combined; omitted for a complete snapshot.
          schema:
            type: array
            maxItems: 256
            items:
              type: string
              minLength: 1
              maxLength: 4096
        - name: refresh
          in: query
          required: false
          description: Force Git to rebuild the complete working tree status snapshot.
          schema:
            type: boolean
      responses:
        "200":
          description: Current status snapshot or the changed records within the requested path scope.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The repository is not registered or its path is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "500":
          description: Git could not read repository status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The Git executable could not be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/diff:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    get:
      operationId: getRepositoryFileDiff
      summary: Read a changed file as a bounded structured split diff
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [workingTree, index]
      responses:
        "200":
          description: Text hunks, binary state, or an explicit unsupported content state.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffDocument"
        "400":
          description: The path or scope is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: GitCrest cannot read the selected file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: The repository or changed path no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "413":
          description: The structured diff exceeds 10 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "504":
          description: Git did not produce the diff within the bounded query deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          description: Git returned an unexpected diff error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The Git executable could not be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/blame:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
      - name: path
        in: query
        required: true
        schema: { type: string, minLength: 1, maxLength: 4096 }
      - name: revision
        in: query
        required: false
        description: Full commit object ID. When omitted, blame uses HEAD.
        schema: { type: string, pattern: "^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$" }
    get:
      operationId: getRepositoryBlame
      summary: Read line blame attribution for a tracked file
      responses:
        "200":
          description: Per-line commit, author, source line, and text attribution.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlameDocument"
        "400":
          description: The path or full commit ID is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository or requested revision is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "413":
          description: Blame output exceeds the bounded response size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "504":
          description: Git blame exceeded its query deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/branches:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    get:
      operationId: getRepositoryBranches
      summary: Read local and remote branches with upstream tracking state
      responses:
        "200":
          description: Branch refs and current ahead/behind counts from local Git refs.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "413":
          description: Branch data exceeds the bounded response size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "504":
          description: Git branch enumeration exceeded its deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    post:
      operationId: createRepositoryBranch
      summary: Queue creation of a local branch at the current HEAD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBranchRequest"
      responses:
        "202":
          description: Branch creation task accepted.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: Branch name is invalid or request body is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: Repository has no commits or the local branch name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Git or task storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/branches/rename:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: renameRepositoryBranch
      summary: Queue a local branch rename
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameBranchRequest" }
      responses:
        "202":
          description: Rename task accepted.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository or source branch is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "409":
          description: A local branch already uses the requested name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
  /api/v1/repositories/{repoId}/branches/favorite:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    put:
      operationId: setRepositoryBranchFavorite
      summary: Persist a branch ref favorite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchFavoriteRequest" }
      responses:
        "200":
          description: Current branch snapshot with the updated favorite state.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository or branch ref is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/branches/switch-preflight:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: preflightRepositoryBranchSwitch
      summary: Inspect working tree changes and target branch overwrite paths
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "200":
          description: Branch switch preflight details.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchSwitchPreflight" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository or local branch is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/branches/switch:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: switchRepositoryBranch
      summary: Queue a local branch switch when local changes do not overlap the target branch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchNameRequest" }
      responses:
        "202":
          description: Switch task accepted.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository or local branch is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "409":
          description: The target is current or local changes overlap paths changed by the target branch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
  /api/v1/repositories/{repoId}/remotes:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: getRepositoryRemotes
      summary: Read remote names and sanitized fetch/push URLs
      responses:
        "200":
          description: Remote configuration with the configured preferred remote, or origin when no preference is set.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "413":
          description: Remote configuration exceeds the bounded response size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "504":
          description: Git did not read remote configuration within its deadline.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    post:
      operationId: addRepositoryRemote
      summary: Queue creation of a Git remote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoteUrlRequest" }
      responses:
        "202":
          description: Remote creation task accepted.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/TaskSnapshot" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Repository is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "409": { description: A remote with this name already exists., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "503": { description: Git or task storage is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/remotes/url:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    put:
      operationId: setRepositoryRemoteUrl
      summary: Queue replacement of a remote URL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoteUrlRequest" }
      responses:
        "202":
          description: Remote URL task accepted.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/TaskSnapshot" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Repository or remote is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: Git or task storage is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/remotes/delete:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: deleteRepositoryRemote
      summary: Queue removal of a Git remote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchNameRequest" }
      responses:
        "202":
          description: Remote removal task accepted.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/TaskSnapshot" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Repository or remote is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: Git or task storage is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/remotes/default:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    put:
      operationId: setRepositoryDefaultRemote
      summary: Set or clear the preferred default remote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefaultRemoteRequest" }
      responses:
        "202":
          description: Default remote task accepted.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/TaskSnapshot" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
