        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: listWorktreeLocalFiles
      summary: List small Git-ignored files (such as .env) that can be copied into a new worktree
      responses:
        "200":
          description: Copyable files.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopyableFiles" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/worktrees/add:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: addRepositoryWorktree
      summary: Check an existing local branch out into a new linked worktree
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddWorktreeRequest" }
