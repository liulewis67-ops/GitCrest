        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: previewIgnoreRule
      summary: Show the line an ignore rule would add, and whether it is already there
      parameters:
        - { name: path, in: query, required: true, description: "Repository-relative path; a trailing slash marks a folder.", schema: { type: string, minLength: 1, maxLength: 1024 } }
        - { name: mode, in: query, required: true, schema: { $ref: "#/components/schemas/IgnoreMode" } }
        - { name: target, in: query, required: true, schema: { $ref: "#/components/schemas/IgnoreTarget" } }
      responses:
        "200":
          description: The ignore rule and where it goes.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content: { application/json: { schema: { $ref: "#/components/schemas/IgnoreRule" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Repository is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/ignore:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: addIgnoreRule
      summary: Add an ignore rule to the repository .gitignore or to the private exclude file
      description: >-
        Appends one line; a line that is already present is not repeated. The change is an ordinary edit
        of the ignore file.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/IgnoreRuleRequest" } } }
      responses:
        "200":
          description: The ignore rule and where it goes.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content: { application/json: { schema: { $ref: "#/components/schemas/IgnoreRule" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Repository is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/image:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: getRepositoryImage
      summary: Read one side of a PNG, JPEG, GIF, WebP or SVG file as the image itself
      description: >-
        Read only. The old side of the working-tree scope is the staged version, of the index scope is HEAD,
        and of the commit scope is the commit's first parent; the new side is the file on disk, the staged
        version and the commit's own version. Images over 8 MiB are refused. The response is sent with
        nosniff and a sandboxing Content-Security-Policy so that it can only be shown as a picture.
      parameters:
        - { name: path, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 1024 } }
        - { name: scope, in: query, required: true, schema: { type: string, enum: [workingTree, index, commit] } }
        - { name: side, in: query, required: true, schema: { type: string, enum: [old, new] } }
        - { name: commitOid, in: query, required: false, description: Required for the commit scope., schema: { type: string, minLength: 40, maxLength: 64 } }
        - { name: originalPath, in: query, required: false, description: Where the file was before a rename; used for the old side., schema: { type: string, maxLength: 1024 } }
      responses:
        "200":
          description: The image bytes with the matching media type.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The repository is unavailable or this version of the image does not exist., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "413": { description: The image is larger than 8 MiB., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "503": { description: Git could not read the image., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/signing:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: getRepositorySigning
      summary: Read the commit signing setup Git resolves for the repository
      description: >-
        Format, key reference, whether commits are signed by default and the configured signing program.
        The key reference is an id, a public key or a file path; key material is never read or returned.
      responses:
        "200":
          description: The signing setup.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content: { application/json: { schema: { $ref: "#/components/schemas/SigningConfig" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The repository is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: Git could not read or test the signing setup., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/signing/test:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: testRepositorySigning
      summary: Sign a throwaway commit with the configured key to check that signing works
      description: >-
        Git makes the signature with its own configured tool; no branch or tag moves and no private key
        reaches GitCrest. A failed signature is a normal 200 answer that carries the tool's own output.
      responses:
        "200":
          description: Whether a signature could be made, and the tool's output when it could not.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content: { application/json: { schema: { $ref: "#/components/schemas/SigningTestResult" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The repository is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: Git could not read or test the signing setup., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/reflog:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: getRepositoryReflog
      summary: Read where HEAD or a local branch has been, newest first
      description: >-
        Read only. The first page also lists the safety refs GitCrest saved before rebases and resets.
        Getting a state back is done through the existing branch creation and reset previews.
      parameters:
        - name: ref
          in: query
          required: false
          description: HEAD (the default) or a local branch as refs/heads/<name>.
          schema: { type: string, maxLength: 255, default: HEAD }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: One page of the reflog.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ReflogPage" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The repository is unavailable or the branch has no reflog., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "413": { description: The reflog is too large to read in one request., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "503": { description: Git could not read the reflog., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/compare:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: compareRepositoryRevisions
      summary: Compare two revisions, or a revision with the working tree
      description: >-
        Read only. Lists the commits only on each side (git log head..base and git log base..head) and the changed files
        (git diff base...head, or git diff base head in two-dot mode). Leaving head out compares base with the working
        tree, which is always two-dot. Each list is paged separately by the same offset and limit. Dropping the request
        stops the Git processes.
      parameters:
        - { name: base, in: query, required: true, description: A branch, tag, commit or relative name such as main~2., schema: { type: string, minLength: 1, maxLength: 255 } }
        - { name: head, in: query, required: false, description: The other side; omitted for the working tree., schema: { type: string, minLength: 1, maxLength: 255 } }
        - { name: mode, in: query, required: false, schema: { type: string, enum: [threeDot, twoDot], default: threeDot } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: The commits and files that differ.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content: { application/json: { schema: { $ref: "#/components/schemas/CompareResult" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The repository is unavailable or a side is not a commit., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "409": { description: The two sides share no history, so only the two-dot view is possible., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "413": { description: The comparison is too large to read in one request., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "503": { description: Git could not compare the two sides., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/compare/diff:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: getRepositoryCompareDiff
      summary: Read one file of a comparison
      description: Read only. from and to are the object ids a comparison returned (fromOid and headOid); leaving to out compares with the working tree.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, pattern: "^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$" } }
        - { name: to, in: query, required: false, schema: { type: string, pattern: "^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$" } }
        - { name: path, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 4096 } }
        - $ref: "#/components/parameters/DiffContext"
      responses:
        "200":
          description: Read-only file diff.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content: { application/json: { schema: { $ref: "#/components/schemas/DiffDocument" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The repository is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/submodules:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: listSubmodules
      summary: List the submodules the repository declares and where each one stands
      description: >-
        Read only. A submodule shows the commit the index records, the commit the last commit records and the commit
        that is checked out. A submodule is opened as its own repository by opening its folder like any other.
      responses:
        "200":
          description: The submodules, by path.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content: { application/json: { schema: { $ref: "#/components/schemas/SubmoduleList" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The repository is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: Git could not read the submodules., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/submodules/update:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: updateSubmodules
      summary: Queue checking out the recorded commit of some or all submodules
      description: >-
        Runs git submodule update --recursive as a task with progress; init also clones submodules that were never
        cloned. Only paths from the submodule list are accepted. The task can be cancelled.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/SubmoduleUpdateRequest" } } }
      responses:
        "202":
          description: Task accepted.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content: { application/json: { schema: { $ref: "#/components/schemas/TaskSnapshot" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The repository is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "409": { description: A merge, rebase or similar Git operation is in progress., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/stashes:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: getRepositoryStashes
      summary: List entries made with git stash, newest first
      description: >-
        Read only. The tracked changes of an entry are the diff of its commit against its base;
        an entry made with --include-untracked also names a commit that holds the untracked files.
        Both commits can be shown through the commit endpoints.
      responses:
        "200":
          description: The stash list; empty when nothing was stashed.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content: { application/json: { schema: { $ref: "#/components/schemas/StashList" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Repository is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: Git could not read the stash list., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/stashes/preview:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: previewStash
      summary: Review what applying a stash entry would touch
      parameters:
        - { name: oid, in: query, required: true, description: The stash commit from the stash list., schema: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" } }
      responses:
        "200":
          description: The paths the entry changes and the local changes that block it.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content: { application/json: { schema: { $ref: "#/components/schemas/StashPreview" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The repository or the stash entry is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/stashes/apply:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: applyStash
      summary: Queue applying (or popping) a stash entry
      description: >-
        The entry is found again by its commit when the task runs. Pop drops the entry only when it applied cleanly.
        A conflicting apply leaves the entry in place and the conflicts in the working tree.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StashApplyRequest" } } }
      responses:
        "202":
          description: Task accepted.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content: { application/json: { schema: { $ref: "#/components/schemas/TaskSnapshot" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The repository or the stash entry is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "409": { description: A Git operation is in progress or HEAD moved after review., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/stashes/drop:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: dropStash
      summary: Drop a stash entry that is still the reviewed commit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StashDropRequest" } } }
      responses:
        "200":
          description: The entry was dropped; its commit stays recoverable from Git until it is garbage collected.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content: { application/json: { schema: { $ref: "#/components/schemas/StashDropped" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The repository or the stash entry is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/stashes/import:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: importStash
      summary: Save a stash entry as a shelf
      description: >-
        Writes a shelf from the entry, including the untracked files of a stash made with --include-untracked.
        The working tree is not changed. The entry is dropped only when requested, and only after the shelf is saved.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StashImportRequest" } } }
      responses:
        "200":
          description: The shelf that was saved.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content: { application/json: { schema: { $ref: "#/components/schemas/StashImported" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The repository or the stash entry is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "413": { description: The stash is too large to become a shelf., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/tags:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: getRepositoryTags
      summary: Page through tags, newest version first, optionally filtered by name or target commit
      parameters:
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - name: filter
          in: query
          required: false
          description: Case-insensitive part of the tag name.
          schema: { type: string, maxLength: 255 }
        - name: targets
          in: query
          required: false
          description: Comma-separated commit ids (at most 200); only tags that point at one of them are listed.
          schema: { type: string }
      responses:
        "200":
          description: One page of tags that point at commits.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TagPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Repository is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: Git could not list tags., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/tags/delete:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: deleteRepositoryTag
      summary: Delete a local tag that still points at the reviewed commit
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DeleteTagRequest" } } }
      responses:
        "200":
          description: The tag was deleted locally; remote tags are untouched.
          headers:
