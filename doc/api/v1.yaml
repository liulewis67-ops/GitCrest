        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository is not registered or its path is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: The current branch has no usable upstream or its tracking ref is gone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Git could not complete the bounded push preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/push:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
