        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    post:
      operationId: stageSelectedDiffHunks
      summary: Queue a revision-checked hunk staging or unstaging task
      description: The request selects hunks or change rows from the current structured diff. The revision is checked again after the repository write lock is acquired.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StagingPatchRequest"
      responses:
        "202":
          description: Partial staging task accepted and durably recorded.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: The hunk selection is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The repository or selected file is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: The selected diff revision expired or the repository has a conflicting state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Git, task capacity, or task storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/staging/discard:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    post:
      operationId: discardSelectedDiffChanges
      summary: Queue reviewed discard of selected working-tree hunks or change rows
      description: The working-tree diff revision and selected changes are checked before queueing and again under the repository write lock. An explicit destructive confirmation is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscardPatchRequest"
      responses:
        "202":
          description: Selected changes discard task accepted after revision revalidation.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: The selection is malformed or confirmation is absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The repository or selected file is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: The selected diff revision expired or the repository has a conflicting state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Git or task capacity is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/shelves:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    get:
      operationId: listRepositoryShelves
      summary: List saved shelves for a repository
      responses:
        "200":
          description: Shelf metadata ordered by creation time.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shelf"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The repository is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "503":
          description: Repository or shelf storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    post:
      operationId: createRepositoryShelf
      summary: Save and remove a reviewed set of text changes
      description: Each selected diff revision and repository HEAD is checked again while holding the repository write lock. The shelf patch is persisted before selected changes are removed; index and working-tree scope are kept distinct.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShelfCreateRequest"
      responses:
        "202":
          description: Shelf creation task accepted and durably recorded.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: Shelf metadata or selection is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The repository or selected file is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: The repository HEAD or selected diff revision became stale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "413":
          description: The selected patch exceeds 10 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Git, task capacity, or shelf storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/shelves/{shelfId}:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
      - name: shelfId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    get:
      operationId: getRepositoryShelf
