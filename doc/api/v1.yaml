        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    post:
      operationId: chooseWorkflowConflictSide
      summary: Resolve one conflicted file by taking the whole ours or theirs version
      description: Requires the conflict-scoped window capability. Works for binary and delete/modify conflicts; rechecks task, operation, HEAD, conflict set and result revision, then stages only this path (or removes it when the chosen side deleted the file).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowConflictChooseRequest"
      responses:
        "202":
          description: Conflict resolution task accepted.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: The request is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The waiting workflow task or repository is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: The file is no longer conflicted in the waiting workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "412":
          description: HEAD, operation or result changed after review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The task queue is full or Git is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/workflows/conflicts/suggestion:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    post:
      operationId: requestWorkflowConflictSuggestion
      summary: Request an AI suggestion for one reviewed text conflict
      description: Requires the conflict-scoped window capability. The server rereads current conflict stages and sends them only after explicit renderer consent; the response is a suggestion and never writes the working result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowConflictSuggestionRequest"
      responses:
        "200":
          description: AI suggestion tied to the reviewed conflict source.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReply"
        "400":
          description: The reviewed conflict selection is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The repository or waiting workflow task is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: The conflict task, path, HEAD or result revision changed after review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "413":
          description: The selected conflict sources exceed the bounded request size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "502":
          description: The AI provider request failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Provider settings, credentials or task state are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/workflows/conflicts/ai-settings:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    get:
      operationId: readConflictWindowAiSettings
      summary: Read sanitized AI provider settings in the conflict window
      description: Requires the conflict-scoped window capability and returns provider metadata and credential presence only; never returns a key. Also returns the exact instructions that open every AI merge prompt, so the window can show them before sending.
      responses:
        "200":
          description: Provider metadata without credentials, and the AI merge prompt instructions.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictWindowAiSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The repository is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Provider settings or credential status are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/push-preflight:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
