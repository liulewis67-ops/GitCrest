          $ref: "#/components/schemas/RepoId"
    get:
      operationId: preflightRepositoryWorkflowRecovery
      summary: Inspect a waiting workflow's conflicts and safe recovery actions
      parameters:
        - name: taskId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: Active operation, bounded path state, and continue/skip/abort availability.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRecoveryPreflight"
        "400":
          description: The waiting task ID is missing or malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The repository or waiting task is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
