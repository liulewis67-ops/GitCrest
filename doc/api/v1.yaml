        "409":
          description: The selected recovery action is unsafe or conflicts remain unresolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "412":
          description: The operation, HEAD, or conflict paths changed after preflight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The task queue is full or Git is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/workflows/conflicts/file:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    get:
      operationId: readWorkflowConflictFile
      summary: Read the three conflict stages and current working result for one waiting workflow file
      parameters:
        - name: taskId
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: path
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        "200":
          description: Base, ours, theirs, persisted result and result revision for a text conflict.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowConflictFile"
        "400":
          description: The task ID or repository-relative path is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The repository, waiting task or working result file is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: The task no longer matches the active conflict operation or file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "413":
          description: The conflict file exceeds the bounded text review size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Git could not read the conflict stages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    put:
      operationId: saveWorkflowConflictFile
      summary: Save text to the current working result for one reviewed conflict file
      description: Requires the conflict-scoped window capability; writes only the exact unmerged path after rechecking task, operation, HEAD and result revision under repository serialization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowConflictSaveRequest"
      responses:
        "202":
          description: Conflict save task accepted.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: The conflict mutation is malformed or exceeds the text limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The waiting workflow task or repository is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: The file is no longer conflicted or cannot be safely written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "412":
          description: HEAD, operation or result changed after review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "413":
          description: Conflict result exceeds 1 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The task queue is full or Git is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/workflows/conflicts/resolved:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    post:
      operationId: markWorkflowConflictResolved
      summary: Stage one marker-free reviewed conflict file as resolved
      description: Requires the conflict-scoped window capability; refuses unresolved marker lines and rechecks task, operation, HEAD, conflict set and result revision before staging only this path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowConflictMutationRequest"
      responses:
        "202":
          description: Conflict resolution task accepted.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: The conflict mutation is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The waiting workflow task or repository is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Conflict markers remain or the file cannot safely be resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "412":
          description: HEAD, operation or result changed after review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The task queue is full or Git is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/workflows/conflicts/choose:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    post:
      operationId: chooseWorkflowConflictSide
      summary: Resolve one conflicted file by taking the whole ours or theirs version
      description: Requires the conflict-scoped window capability. Works for binary and delete/modify conflicts; rechecks task, operation, HEAD, conflict set and result revision, then stages only this path (or removes it when the chosen side deleted the file).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowConflictChooseRequest"
      responses:
        "202":
          description: Conflict resolution task accepted.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: The request is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The waiting workflow task or repository is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: The file is no longer conflicted in the waiting workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "412":
          description: HEAD, operation or result changed after review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The task queue is full or Git is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/workflows/conflicts/suggestion:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    post:
      operationId: requestWorkflowConflictSuggestion
      summary: Request an AI suggestion for one reviewed text conflict
      description: Requires the conflict-scoped window capability. The server rereads current conflict stages and sends them only after explicit renderer consent; the response is a suggestion and never writes the working result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowConflictSuggestionRequest"
      responses:
        "200":
          description: AI suggestion tied to the reviewed conflict source.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiReply"
        "400":
          description: The reviewed conflict selection is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The repository or waiting workflow task is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: The conflict task, path, HEAD or result revision changed after review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "413":
          description: The selected conflict sources exceed the bounded request size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "502":
          description: The AI provider request failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Provider settings, credentials or task state are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/workflows/conflicts/ai-settings:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    get:
      operationId: readConflictWindowAiSettings
      summary: Read sanitized AI provider settings in the conflict window
      description: Requires the conflict-scoped window capability and returns provider metadata and credential presence only; never returns a key.
      responses:
        "200":
          description: Provider metadata without credentials.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The repository is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Provider settings or credential status are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/push-preflight:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    get:
      operationId: preflightRepositoryPush
      summary: Preview the current branch push target and changed scope
      parameters:
        - name: remoteName
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 255 }
          description: Optional explicit configured remote. Provide together with remoteBranch to review a one-off Push to target.
        - name: remoteBranch
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 255 }
          description: Optional explicit branch on remoteName.
      responses:
        "200":
          description: Current upstream, compare-and-swap OIDs, commits to push, and changed paths.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPreflight"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository is not registered or its path is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: The current branch has no usable upstream or its tracking ref is gone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Git could not complete the bounded push preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/push:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    post:
      operationId: pushRepository
      summary: Queue a push using a reviewed preflight snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRequest"
      responses:
        "202":
          description: Push task accepted and durably recorded before execution.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: Push request is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository is not registered or its path is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: The preview is stale, there is nothing to push, or normal push requires fetching first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The task queue is full or Git cannot be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: taskId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTask
      summary: Read a task and its sanitized logs
      responses:
        "200":
          description: Task state.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The task is not retained in this sidecar session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
  /api/v1/tasks/{taskId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: taskId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: cancelTask
      summary: Request cooperative cancellation of a task
      description: Cancellation is an intent. A running task becomes cancelled only after its operation reaches a safe stop point.
      responses:
        "200":
          description: The latest task state after recording the cancellation request.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The task is not retained in this sidecar session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
components:
  securitySchemes:
    sessionBearer:
      type: http
      scheme: bearer
      bearerFormat: session token
  headers:
    ApiVersion:
      description: Major API contract version used by this response.
      schema:
        type: string
        const: "1"
  responses:
    BadRequest:
      description: The request body or branch name is invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiErrorResponse" }
    Unauthorized:
      description: Missing or invalid session token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              code: AUTH_UNAUTHORIZED
              message: A valid session bearer token is required.
    Forbidden:
      description: The caller is authenticated but does not have the requested window capability.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              code: AUTH_FORBIDDEN
              message: This window has read-only access.
    UnsupportedVersion:
      description: The requested API major version is not supported.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              code: API_VERSION_UNSUPPORTED
              message: The requested API major version is not supported.
    StateConflict:
      description: The operation conflicts with the repository's current Git state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              code: REPOSITORY_STATE_CONFLICT
              message: A merge is already in progress.
    StaleResource:
      description: The supplied resource version or precondition has expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              code: RESOURCE_VERSION_STALE
              message: The resource changed since it was read. Refresh and retry.
  parameters:
    ApiVersion:
      name: X-GitCrest-API-Version
      in: header
      required: true
      schema:
        type: string
        const: "1"
  schemas:
    RepoId:
      type: string
      minLength: 1
      maxLength: 128
      description: Opaque, stable ID assigned by RepositoryManager; never a filesystem path.
      example: repo_01J9M6G3C4Y4Y2B8YH7AKQ2K8N
    VersionResponse:
      type: object
      additionalProperties: false
      required: [name, version, apiVersion]
      properties:
        name:
          type: string
        version:
          type: string
        apiVersion:
          type: integer
          const: 1
    Repository:
      type: object
      additionalProperties: false
      required: [repoId, path, head, branch, detached, state, isFavorite, lastAccessedAt, availability]
      properties:
        repoId:
          $ref: "#/components/schemas/RepoId"
        path:
          type: string
        head:
          type: [string, "null"]
        branch:
          type: [string, "null"]
        detached:
          type: boolean
        state:
          type: string
          enum: [normal, merging, rebasing, cherryPicking, bisecting]
        isFavorite:
          type: boolean
        lastAccessedAt:
          type: integer
          format: int64
          minimum: 0
        availability:
          type: string
          enum: [available, missing]
    StatusSnapshot:
      type: object
      additionalProperties: false
      required: [repoId, refreshedAtMs, files]
      properties:
        repoId:
          $ref: "#/components/schemas/RepoId"
        refreshedAtMs:
          type: integer
          format: int64
          minimum: 0
        files:
          type: array
          items:
            $ref: "#/components/schemas/StatusFile"
    StatusFile:
      type: object
      additionalProperties: false
      required: [path, indexStatus, worktreeStatus, kind, categories, modeChanged]
      properties:
        path:
          type: string
        originalPath:
          type: string
        indexStatus:
          type: string
          minLength: 1
          maxLength: 1
        worktreeStatus:
          type: string
          minLength: 1
          maxLength: 1
        kind:
          type: string
          enum: [modified, added, deleted, renamed, copied, typeChanged, untracked, ignored, conflicted]
        categories:
          type: array
          items:
            type: string
            enum: [staged, unstaged, untracked, ignored, conflicted]
        modeChanged:
          type: boolean
    DiffDocument:
      type: object
      additionalProperties: false
      required: [repoId, path, revision, originalPath, scope, changeKind, status, hunks]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        path: { type: string }
        revision: { type: string, minLength: 1 }
        originalPath: { type: [string, "null"] }
        scope: { type: string, enum: [workingTree, index, commit] }
        changeKind: { type: string, enum: [modified, added, deleted, renamed, copied, typeChanged, untracked, ignored, conflicted] }
        status: { type: string, enum: [text, binary, empty, conflicted, ignored, symlink, submodule] }
        hunks:
          type: array
          items: { $ref: "#/components/schemas/DiffHunk" }
    BlameDocument:
      type: object
      additionalProperties: false
      required: [repoId, path, revision, lines]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        path: { type: string }
        revision: { type: [string, "null"] }
        lines:
          type: array
          items: { $ref: "#/components/schemas/BlameLine" }
    BlameLine:
      type: object
      additionalProperties: false
      required: [lineNumber, originalLineNumber, commitOid, authorName, authorEmail, committedAtMs, summary, text]
      properties:
        lineNumber: { type: integer, minimum: 1 }
        originalLineNumber: { type: integer, minimum: 1 }
        commitOid: { type: string, pattern: "^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$" }
        authorName: { type: string }
        authorEmail: { type: string }
        committedAtMs: { type: integer, format: int64 }
        summary: { type: string }
        text: { type: string }
    DiffHunk:
      type: object
      additionalProperties: false
      required: [oldStart, oldLines, newStart, newLines, rows]
      properties:
        oldStart: { type: integer, minimum: 0 }
        oldLines: { type: integer, minimum: 0 }
        newStart: { type: integer, minimum: 0 }
        newLines: { type: integer, minimum: 0 }
        rows:
          type: array
          items: { $ref: "#/components/schemas/DiffRow" }
    DiffRow:
      type: object
      additionalProperties: false
      required: [kind, oldLine, newLine, oldText, newText]
      properties:
        kind: { type: string, enum: [context, change] }
        oldLine: { type: [integer, "null"], minimum: 0 }
        newLine: { type: [integer, "null"], minimum: 0 }
        oldText: { type: [string, "null"] }
        newText: { type: [string, "null"] }
    StagingRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [stageFile, unstageFile, stageAll, unstageAll]
        path:
          type: string
          minLength: 1
          description: Repository-relative path, required for file actions and forbidden for all-file actions.
    CommitPage:
      type: object
      additionalProperties: false
      required: [repoId, offset, limit, commits, nextOffset]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        commits:
          type: array
          items: { $ref: "#/components/schemas/CommitSummary" }
        nextOffset: { type: [integer, "null"], minimum: 0 }
        searchPending:
          type: boolean
          description: True when a message search is waiting for the repository history index; retry the same query and offset.
    CommitSummary:
      type: object
      additionalProperties: false
      required: [oid, parents, authorName, authorEmail, committedAtMs, subject]
      properties:
        oid: { type: string, pattern: "^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$" }
        parents:
          type: array
          items: { type: string }
        authorName: { type: string }
        authorEmail: { type: string }
        committedAtMs: { type: integer, format: int64 }
        subject: { type: string }
    CommitDetail:
      type: object
      additionalProperties: false
      required: [repoId, oid, parents, authorName, authorEmail, committedAtMs, message, stats, files]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        oid: { type: string }
        parents:
          type: array
          items: { type: string }
        authorName: { type: string }
        authorEmail: { type: string }
