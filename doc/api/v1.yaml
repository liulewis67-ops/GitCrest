          content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRepositorySettings" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Repository is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: Pipeline settings are unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/pipelines/rules:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: listPipelineRules
      summary: List this repository's pipeline rules in execution order
      responses:
        "200":
          description: The ordered rules.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRules" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Repository is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: Pipeline rules are unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
    put:
      operationId: replacePipelineRules
      summary: Replace the whole ordered rule list, validated as a unit
      description: A rule with a protected-looking target (main, master, release/*, prod*) is saved with confirmation set to ask.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRules" } } }
      responses:
        "200":
          description: The saved rules after normalization.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRules" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Repository is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: Pipeline rules are unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/pipelines/runs:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: listPipelineRuns
      summary: List recent pipeline runs of this repository, newest first
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The runs with their steps.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRuns" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Repository is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: Pipeline runs are unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
    post:
      operationId: startPipelineRun
      summary: Confirm a run that waits for confirmation, or start a rule manually
      description: Send runId (optionally with targets) to confirm a pending run, or ruleId, sourceBranch and sourceOid to run a rule for a commit without pushing. The run continues in the background; follow it with pipeline.run.updated events or GET.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StartPipelineRunRequest" } } }
      responses:
        "202":
          description: The run, now running or queued behind another run of this repository.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRun" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Repository, rule or run is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "409": { description: Another run holds the repository, the run is not waiting for confirmation, or the source branch is a target of a run in progress., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "503": { description: Pipeline runs are unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/pipelines/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
      - name: runId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getPipelineRun
      summary: Read one pipeline run with its steps
      responses:
        "200":
          description: The run.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRun" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Repository or run is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: Pipeline runs are unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/pipelines/runs/{runId}/actions:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
      - name: runId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: actOnPipelineRun
      summary: Resume, skip the waiting target, or stop a run
      description: resume starts a run that waits for confirmation or continues one whose conflicts were resolved; skipTarget and stop apply to a run waiting for conflicts.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRunActionRequest" } } }
      responses:
        "200":
          description: The run after the action.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRun" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Repository or run is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "409": { description: The run is not in a state that allows the action., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "503": { description: Pipeline runs are unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/credentials:
    parameters:
      - name: X-GitCrest-API-Version
        in: header
        required: true
        schema: { type: string, enum: ["1"] }
    get:
      operationId: getCredentialStatus
      summary: Read credential presence and username without returning the secret
      parameters:
        - name: host
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 260 }
      responses:
        "200":
          description: Metadata only; credential values are never returned.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/CredentialStatus" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: The system credential store is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
    put:
      operationId: setCredential
      summary: Store an HTTPS credential in the system credential store
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetCredentialRequest" }
      responses:
        "200":
          description: Credential metadata only; the saved token is never returned.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/CredentialStatus" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: The system credential store is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
    delete:
      operationId: deleteCredential
      summary: Remove a host credential from the system credential store
      parameters:
        - name: host
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 260 }
      responses:
        "204": { description: Credential removed or already absent., headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: The system credential store is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/accounts:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    get:
      operationId: listAccounts
      summary: List signed-in GitHub and GitLab accounts and which one Git uses for each host
      responses:
        "200":
          description: Account metadata only; tokens are never returned.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AccountList" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: Account storage is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/accounts/tokens:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: signInWithToken
      summary: Validate an access token with the provider and sign in as its user
      description: Signing in again as the same provider user replaces that account's token. The first account on a host becomes the one Git uses for it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenSignInRequest" }
      responses:
        "200":
          description: The signed-in account; the token is never returned.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "422": { description: The provider rejected the token., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "502": { description: The provider could not be reached or answered unexpectedly., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "503": { description: Account storage or the system credential store is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/accounts/device-flows:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: startDeviceFlow
      summary: Start a browser sign-in (OAuth device flow)
      description: >-
        Returns a code the user enters on the provider's verification page. The core polls the provider in the
        background and stores the account when the user approves; read the outcome from the flow. Starting again for
        the same provider and host replaces a flow that is still pending. Only hosts listed in AccountList.browserSignIn
        support this.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceFlowRequest" }
      responses:
        "200":
          description: The pending flow.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/DeviceFlow" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "409": { description: Browser sign-in is not available for this provider and host (ACCOUNT_PROVIDER_NOT_CONFIGURED)., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "502": { description: The provider could not be reached or refused the request (ACCOUNT_SIGN_IN_REJECTED)., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/accounts/device-flows/{flowId}:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - $ref: "#/components/parameters/FlowId"
    get:
      operationId: getDeviceFlow
      summary: Read a browser sign-in's status
      description: Finished flows stay readable for ten minutes.
      responses:
        "200":
          description: The flow; the token is never returned.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/DeviceFlow" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: The flow ended or never existed (ACCOUNT_FLOW_NOT_FOUND)., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
    delete:
      operationId: cancelDeviceFlow
      summary: Cancel a browser sign-in and stop polling the provider
      responses:
        "204": { description: Cancelled., headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The flow ended or never existed (ACCOUNT_FLOW_NOT_FOUND)., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - $ref: "#/components/parameters/AccountId"
    delete:
      operationId: signOutAccount
      summary: Sign out and forget the account's token
      description: When the account was the one Git used for its host, another account on that host takes over.
      responses:
        "204": { description: Signed out., headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The account is not signed in., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: Account storage or the system credential store is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/accounts/{accountId}/select:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: selectAccount
      summary: Make this account the one Git uses for its host
      responses:
        "200":
          description: The selected account.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The account is not signed in., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: Account storage is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/accounts/{accountId}/validate:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - $ref: "#/components/parameters/AccountId"
    post:
      operationId: validateAccount
      summary: Check the stored token with the provider and refresh the profile
      description: >-
        A rejected or missing token sets the account state to needsReauth instead of failing. A browser sign-in's
        token that is about to expire or is rejected is renewed with its refresh token first.
      responses:
        "200":
          description: The account after validation.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: The account is not signed in., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "502": { description: The provider could not be reached or answered unexpectedly., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "503": { description: Account storage or the system credential store is unavailable., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/ai/settings:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    get:
      operationId: getAiSettings
      summary: Read the configured AI providers and which one is active
      description: The configuration lives in ai-providers.json beside the core database. API keys stay in that file and are never returned; each provider reports only whether it has one.
      responses:
        "200":
          description: Providers without their API keys.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AiSettings" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: ai-providers.json could not be read or is not valid JSON., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
    put:
      operationId: setAiSettings
      summary: Replace the provider list and active provider without making a provider request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiSettingsRequest" }
      responses:
        "200":
          description: The saved providers without their API keys.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AiSettings" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "503": { description: ai-providers.json could not be read or written., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/ai/providers/test:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: testAiProvider
      summary: Send a fixed one-line prompt, and no repository content, to check a provider's settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiProviderTestRequest" }
      responses:
        "200":
          description: The provider answered.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AiProviderTestReply" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "502": { description: The provider could not be reached or rejected the request; the message names the HTTP status and the provider's error text without the API key., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/ai/request:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: requestAiReview
      summary: Send only the selected, current text diff scopes to the configured provider
      description: The core reloads each diff by repoId/path/scope, rejects stale revisions and never logs prompt or diff text. A direct user confirmation is required in the desktop UI.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiRequest" }
      responses:
        "200":
          description: Provider response and the selected file/scope labels.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AiReply" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Repository or selected path was not found., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "409": { description: Provider is disabled or a reviewed diff revision is stale., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "502": { description: Provider request failed; response content and secret values are not returned in the error., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/worktrees:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: listRepositoryWorktrees
      summary: List the working trees linked to this repository
      responses:
        "200":
          description: Linked worktrees.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/worktrees/folder-check:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: checkWorktreeFolder
      summary: Check whether a folder can receive a new worktree
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        "200":
          description: Folder status.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorktreeFolderCheck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/worktrees/local-files:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: listWorktreeLocalFiles
      summary: List small Git-ignored files (such as .env) that can be copied into a new worktree
      responses:
        "200":
          description: Copyable files.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopyableFiles" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/worktrees/add:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: addRepositoryWorktree
      summary: Check an existing local branch out into a new linked worktree
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddWorktreeRequest" }
      responses:
        "202":
          description: Worktree creation task accepted.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository or local branch is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "409":
          description: The branch is already checked out in another worktree.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
  /api/v1/repositories/{repoId}/worktrees/prune:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: pruneRepositoryWorktrees
      summary: Forget worktrees whose folders no longer exist
      responses:
        "202":
          description: Clean-up task accepted.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/worktrees/remove:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: removeRepositoryWorktree
      summary: Queue removal of a linked worktree
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveWorktreeRequest" }
      responses:
        "202":
          description: Removal task accepted.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/branches/delete-preview:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: previewRepositoryBranchDelete
      summary: Count branch commits not reachable from the current branch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchNameRequest" }
      responses:
        "200":
          description: Delete impact preview.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchDeletePreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository or local branch is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/branches/delete:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: deleteRepositoryBranch
      summary: Queue guarded deletion of a local branch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteBranchRequest" }
      responses:
        "202":
          description: Delete task accepted.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository or local branch is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "409":
          description: The branch is current, or unmerged commits need explicit confirmation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
  /api/v1/repositories/{repoId}/branches/remote-delete-preview:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    get:
      operationId: previewRepositoryRemoteBranchDelete
      summary: Review a remote branch ref, commits, and changed paths before deletion
      parameters:
        - name: remoteName
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
        - name: remoteBranch
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "200":
          description: Snapshot-bound remote delete impact and lease OID.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteBranchDeletePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Repository or remote-tracking branch is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/branches/remote-delete:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: deleteRepositoryRemoteBranch
      summary: Queue confirmed remote branch deletion with force-with-lease protection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoteBranchDeleteRequest" }
      responses:
        "202":
          description: Remote deletion task accepted after snapshot revalidation.
          headers:
            X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskSnapshot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The repository or remote-tracking branch is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "409":
          description: A Git operation is active in the repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "412":
          description: The reviewed tracking ref or impact changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "503": { description: The task queue is full or Git cannot be started., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    get:
      operationId: listRepositories
      summary: List recent repositories saved on this device
      responses:
        "200":
          description: The complete repository list, ordered favorites first and then by last accessed time.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Repository"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
    post:
      operationId: openRepository
      summary: Validate and register a user-selected local Git working tree
      description: The path is accepted only for this open operation. Subsequent repository operations use repoId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenRepositoryRequest"
      responses:
        "200":
          description: Repository opened or already registered in this session.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "400":
          description: Missing or malformed repository path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The selected path cannot be read by GitCrest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: The selected path does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "422":
          description: The selected folder is not a Git working tree.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: The Git executable could not be started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/clones:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    post:
      operationId: cloneRepository
      summary: Queue a clone into a user-selected parent folder
      description: Clones to a private staging folder and registers the repository only after a successful move.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [remoteUrl, parentPath, directoryName]
              properties:
                remoteUrl: { type: string, minLength: 1, maxLength: 2048 }
                parentPath: { type: string, minLength: 1 }
                directoryName: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "202":
          description: Clone task accepted.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: Remote or destination is invalid.
