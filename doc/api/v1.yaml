      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        taskId: { type: string }
        operation: { type: string, enum: [merge, cherryPick, revert, rebase, shelfApply] }
        headOid: { type: [string, "null"], minLength: 40, maxLength: 64 }
        dirtyPaths: { type: array, maxItems: 200, items: { type: string } }
        omittedDirtyPathCount: { type: integer, minimum: 0 }
        conflictedPaths: { type: array, maxItems: 200, items: { type: string } }
        omittedConflictedPathCount: { type: integer, minimum: 0 }
        canContinue: { type: boolean }
        canSkip: { type: boolean }
        canAbort: { type: boolean }
    WorkflowRecoveryRequest:
      type: object
      additionalProperties: false
      required: [taskId, action, expectedOperation, expectedHeadOid, expectedConflictedPaths]
      properties:
        taskId: { type: string, minLength: 1, maxLength: 128 }
