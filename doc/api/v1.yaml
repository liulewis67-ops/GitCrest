      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        taskId: { type: string }
        path: { type: string }
        operation: { type: string, enum: [merge, cherryPick, revert, rebase, shelfApply] }
        headOid: { type: [string, "null"], minLength: 40, maxLength: 64 }
        baseContent: { type: [string, "null"], maxLength: 1048576 }
        oursContent: { type: [string, "null"], maxLength: 1048576 }
        theirsContent: { type: [string, "null"], maxLength: 1048576 }
        resultContent: { type: [string, "null"], maxLength: 1048576 }
        resultRevision: { type: string, minLength: 64, maxLength: 64, pattern: "^[0-9a-f]+$" }
        isText: { type: boolean }
        oursPresent: { type: boolean }
        theirsPresent: { type: boolean }
