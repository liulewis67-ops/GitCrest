    put:
      operationId: setAiSettings
      summary: Save AI provider metadata without making a provider request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiSettingsRequest" }
      responses:
        "200":
          description: Saved configuration and secret presence metadata.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AiSettings" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/ai/credential:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
    put:
      operationId: setAiCredential
      summary: Store an OpenAI-compatible API key in the system credential store
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiCredentialRequest" }
      responses:
        "200":
          description: Provider metadata only; the key is never returned.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AiSettings" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
