    put:
      operationId: setPipelineAppSettings
      summary: Replace the app-wide defaults for post-push pipelines
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PipelineAppSettings" } } }
      responses:
        "200":
          description: The saved defaults.
