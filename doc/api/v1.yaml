            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
    delete:
      operationId: deleteRepositoryShelf
      summary: Delete a saved shelf without changing the working tree
      responses:
        "204":
          description: Shelf metadata and patch deleted.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The repository or shelf is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "503":
          description: Shelf storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/shelves/{shelfId}/apply-preview:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
      - name: shelfId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    get:
      operationId: preflightRepositoryShelfApply
      summary: Preview a saved shelf against the current working tree
      description: Returns a revision binding the saved patch, HEAD and current diffs of every affected path. A false canApplyCleanly means the patch must be reviewed after the target branch or affected files change; no changes are made by preview.
      responses:
        "200":
          description: Current shelf apply preview.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShelfApplyPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The repository or shelf is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: An affected path is conflicted or the shelf predates scope metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Git or shelf storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/shelves/{shelfId}/apply:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
      - name: shelfId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    post:
      operationId: applyRepositoryShelf
      summary: Queue application of a previously reviewed shelf
      description: The task rechecks HEAD, affected diff revisions and Git apply preflight under repository serialization. Stale or non-applicable shelves are preserved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShelfApplyRequest"
      responses:
        "202":
          description: Shelf application task accepted.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: The reviewed apply request is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The repository or shelf is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: The reviewed HEAD or affected diffs are stale, or the shelf cannot be restored safely.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Git, task capacity or shelf storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/v1/repositories/{repoId}/commits:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/RepoId"
    get:
      operationId: listRepositoryCommits
      summary: Read a bounded page of commits from HEAD and branch refs with optional filters
      parameters:
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: sha
          in: query
          required: false
          description: Full or unambiguous hexadecimal commit ID or prefix.
          schema: { type: string, minLength: 4, maxLength: 64, pattern: "^[a-fA-F0-9]+$" }
        - name: author
          in: query
          required: false
          description: Literal, case-insensitive author name or email substring.
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: message
          in: query
          required: false
          description: Literal, case-insensitive substring of the commit message.
          schema: { type: string, minLength: 1, maxLength: 512 }
        - name: branch
          in: query
          required: false
          description: Exact short name of a local or remote branch.
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: path
          in: query
          required: false
          description: Exact repository-relative path changed by the commit.
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: since
          in: query
          required: false
          description: Include commits on or after this calendar date (UTC).
          schema: { type: string, format: date }
        - name: until
          in: query
          required: false
          description: Include commits on or before this calendar date (UTC).
          schema: { type: string, format: date }
      responses:
        "200":
          description: Bounded commit page in topological order. Tags are excluded from the initial walk.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitPage"
        "400":
          description: Offset, page size, or one of the filters is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository is not registered or its path is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "413":
          description: History output exceeds the bounded response size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "504":
          description: Git history read exceeded its deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    post:
      operationId: commitRepository
      summary: Queue a commit from the staged changes
      description: Commit writes the message through standard input, checks staged changes after acquiring the repository task lock, and refreshes repository metadata after execution. Optional row selections are applied to a temporary index based on HEAD; the repository index is left intact so unselected staged changes remain staged on success, hook failure, and cancellation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRequest"
      responses:
        "202":
          description: Commit task accepted and durably recorded.
          headers:
            X-GitCrest-API-Version:
              $ref: "#/components/headers/ApiVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSnapshot"
        "400":
          description: Commit message is empty, malformed, or contains NUL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Repository is not registered or its path is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "406":
          $ref: "#/components/responses/UnsupportedVersion"
        "409":
          description: No staged changes remain, unresolved conflicts exist, amend has no HEAD, or the selected diff revision is stale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "413":
          description: Commit message exceeds 64 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Git, task capacity, or task storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
