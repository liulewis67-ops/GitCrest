      type: object
      additionalProperties: false
      required: [taskId, path, expectedOperation, expectedHeadOid, expectedResultRevision, side]
      properties:
        taskId: { type: string, minLength: 1, maxLength: 128 }
        path: { type: string, minLength: 1, maxLength: 4096 }
        expectedOperation: { type: string, enum: [merge, cherryPick, revert, rebase, shelfApply] }
        expectedHeadOid: { type: string, minLength: 40, maxLength: 64 }
        expectedResultRevision: { type: string, minLength: 64, maxLength: 64, pattern: "^[0-9a-f]+$" }
        side: { type: string, enum: [ours, theirs] }
    WorkflowConflictMutationRequest:
      type: object
      additionalProperties: false
      required: [taskId, path, expectedOperation, expectedHeadOid, expectedResultRevision]
      properties:
        taskId: { type: string, minLength: 1, maxLength: 128 }
        path: { type: string, minLength: 1, maxLength: 4096 }
        expectedOperation: { type: string, enum: [merge, cherryPick, revert, rebase, shelfApply] }
        expectedHeadOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        expectedResultRevision: { type: string, minLength: 64, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
    WorkflowConflictSuggestionRequest:
      type: object
      additionalProperties: false
      required: [taskId, path, expectedOperation, expectedHeadOid, expectedResultRevision]
      properties:
        taskId: { type: string, minLength: 1, maxLength: 128 }
        path: { type: string, minLength: 1, maxLength: 4096 }
        expectedOperation: { type: string, enum: [merge, cherryPick, revert, rebase, shelfApply] }
        expectedHeadOid: { type: [string, "null"], minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        expectedResultRevision: { type: string, minLength: 64, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
    WorkflowConflictSaveRequest:
      type: object
      additionalProperties: false
      required: [taskId, path, expectedOperation, expectedHeadOid, expectedResultRevision, content]
      properties:
        taskId: { type: string, minLength: 1, maxLength: 128 }
        path: { type: string, minLength: 1, maxLength: 4096 }
        expectedOperation: { type: string, enum: [merge, cherryPick, revert, rebase, shelfApply] }
        expectedHeadOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        expectedResultRevision: { type: string, minLength: 64, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        content: { type: string, maxLength: 1048576 }
    PushPreflight:
      type: object
      additionalProperties: false
      required: [repoId, localBranch, remoteName, remoteBranch, localOid, expectedRemoteOid, ahead, behind, commitsToPush, overwrittenCommitCount, changedPaths, changedPathCount, omittedChangedPathCount]
      properties:
        repoId: { $ref: "#/components/schemas/RepoId" }
        localBranch: { type: string }
        remoteName: { type: string }
        remoteBranch: { type: string }
        localOid: { type: string, minLength: 40, maxLength: 64 }
        expectedRemoteOid: { type: string, minLength: 40, maxLength: 64, description: Local remote-tracking OID used as the force-with-lease expectation. }
        ahead: { type: integer, minimum: 0 }
        behind: { type: integer, minimum: 0 }
        commitsToPush: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/PushCommit" } }
        overwrittenCommitCount: { type: integer, minimum: 0, description: Commits present on the tracked remote but absent from the local branch. }
        changedPaths: { type: array, maxItems: 200, items: { type: string } }
        changedPathCount: { type: integer, minimum: 0 }
        omittedChangedPathCount: { type: integer, minimum: 0 }
    PushCommit:
      type: object
      additionalProperties: false
      required: [oid, subject]
      properties:
        oid: { type: string, minLength: 40, maxLength: 64 }
        subject: { type: string, maxLength: 4096 }
    PushRequest:
      type: object
      additionalProperties: false
      required: [expectedLocalOid, expectedRemoteOid, forceWithLease, remoteName, remoteBranch]
      properties:
        expectedLocalOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        expectedRemoteOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
