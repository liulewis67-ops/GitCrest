    put:
      operationId: setPipelineRepositorySettings
      summary: Replace this repository's pipeline overrides; a missing or null field clears it
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PipelineRepositorySettingsRequest" } } }
      responses:
        "200":
          description: Overrides and the effective values after saving.
