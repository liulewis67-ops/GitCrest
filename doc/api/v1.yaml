        expectedHeadOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        backupReference: { type: string, pattern: "^refs/gitcrest/reset-backups/[A-Za-z0-9-]+$" }
        backupOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        confirmRestore: { type: boolean, description: Must be true after explicit confirmation. }
    WorkflowRequest:
      type: object
      additionalProperties: false
      required: [action, targetOid, expectedHeadOid]
      properties:
        action: { type: string, enum: [merge, cherryPick, revert] }
        targetOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
        expectedHeadOid: { type: string, minLength: 40, maxLength: 64, pattern: "^[0-9a-fA-F]+$" }
