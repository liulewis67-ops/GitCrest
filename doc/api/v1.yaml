    delete:
      operationId: deleteAiCredential
      summary: Remove the saved OpenAI-compatible API key
      responses:
        "204": { description: Credential removed or already absent., headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
  /api/v1/repositories/{repoId}/ai/request:
    parameters:
      - $ref: "#/components/parameters/ApiVersion"
      - name: repoId
        in: path
        required: true
        schema: { $ref: "#/components/schemas/RepoId" }
    post:
      operationId: requestAiReview
      summary: Send only the selected, current text diff scopes to the configured provider
      description: The core reloads each diff by repoId/path/scope, rejects stale revisions and never logs prompt or diff text. A direct user confirmation is required in the desktop UI.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiRequest" }
      responses:
        "200":
          description: Provider response and the selected file/scope labels.
          headers: { X-GitCrest-API-Version: { $ref: "#/components/headers/ApiVersion" } }
          content: { application/json: { schema: { $ref: "#/components/schemas/AiReply" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Repository or selected path was not found., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "406": { $ref: "#/components/responses/UnsupportedVersion" }
        "409": { description: Provider is disabled or a reviewed diff revision is stale., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "502": { description: Provider request failed; response content and secret values are not returned in the error., content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /api/v1/repositories/{repoId}/worktrees:
