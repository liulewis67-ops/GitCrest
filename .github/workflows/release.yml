name: Signed desktop release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify version tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo 'The signed release workflow must be dispatched from a version tag.' >&2
            exit 1
          fi
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match package version v$version." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gitcrest-core -> target

      - run: pnpm install --frozen-lockfile

      - name: Require Windows release signing configuration
        if: matrix.platform == 'windows'
        shell: bash
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          WINDOWS_UPDATE_PUBLISHER_NAME: ${{ secrets.WINDOWS_UPDATE_PUBLISHER_NAME }}
        run: |
          if [[ -z "$WINDOWS_CSC_LINK" || -z "$WINDOWS_UPDATE_PUBLISHER_NAME" ]]; then
            echo 'Set WINDOWS_CSC_LINK and WINDOWS_UPDATE_PUBLISHER_NAME before making a Windows release.' >&2
            exit 1
          fi

      - name: Build and sign Windows NSIS package
        if: matrix.platform == 'windows'
        run: pnpm electron:package:windows-release
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITCREST_RELEASE_PLATFORM: win32
          WINDOWS_UPDATE_PUBLISHER_NAME: ${{ secrets.WINDOWS_UPDATE_PUBLISHER_NAME }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      - name: Verify Windows package and publisher
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_UPDATE_PUBLISHER_NAME: ${{ secrets.WINDOWS_UPDATE_PUBLISHER_NAME }}
        run: |
          $installer = Get-ChildItem -LiteralPath dist -Filter 'GitCrest Setup *.exe' | Select-Object -First 1
          if (-not $installer) { throw 'The signed NSIS installer was not generated.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Expected a valid Authenticode signature, got $($signature.Status)." }
          if ($signature.SignerCertificate.Subject -ne $env:WINDOWS_UPDATE_PUBLISHER_NAME) {
            throw "The configured update publisher does not match the signing certificate subject: $($signature.SignerCertificate.Subject)"
          }

      - name: Require macOS signing and notarization configuration
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$MACOS_CSC_LINK" || -z "$APPLE_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo 'Set MACOS_CSC_LINK, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID before making a macOS release.' >&2
            exit 1
          fi

      - name: Build, sign, and notarize macOS DMG and ZIP
        if: matrix.platform == 'macos'
        run: pnpm electron:package:macos-release
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITCREST_RELEASE_PLATFORM: darwin
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS signature and Gatekeeper assessment
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          app_bundle=$(find dist -maxdepth 3 -path '*/GitCrest.app' -print -quit)
          if [[ -z "$app_bundle" ]]; then
            echo 'The notarized GitCrest.app was not generated.' >&2
            exit 1
          fi
          codesign --verify --deep --strict "$app_bundle"
          spctl --assess --type execute --verbose "$app_bundle"

      - name: Validate Linux update signing key
        if: matrix.platform == 'linux'
        shell: bash
        env:
          LINUX_UPDATE_SIGNING_KEY: ${{ secrets.LINUX_UPDATE_SIGNING_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { createPrivateKey } from 'node:crypto';

          if (!process.env.LINUX_UPDATE_SIGNING_KEY) throw new Error('Set LINUX_UPDATE_SIGNING_KEY before making a Linux release.');
          const key = createPrivateKey(process.env.LINUX_UPDATE_SIGNING_KEY);
          if (key.asymmetricKeyType !== 'ed25519') throw new Error('The Linux update key must use Ed25519.');
          NODE

      - name: Build Linux AppImage with release trust key
        if: matrix.platform == 'linux'
        run: pnpm electron:package:linux-release
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          LINUX_UPDATE_SIGNING_KEY: ${{ secrets.LINUX_UPDATE_SIGNING_KEY }}

      - name: Verify Linux package trust key
        if: matrix.platform == 'linux'
        shell: bash
        env:
          LINUX_UPDATE_SIGNING_KEY: ${{ secrets.LINUX_UPDATE_SIGNING_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { createPrivateKey, createPublicKey } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          import { load } from 'js-yaml';

          const key = createPrivateKey(process.env.LINUX_UPDATE_SIGNING_KEY);
          if (key.asymmetricKeyType !== 'ed25519') throw new Error('The Linux update key must use Ed25519.');
          const publicKey = createPublicKey(key).export({ type: 'spki', format: 'der' }).toString('base64');
          const config = load(await readFile('dist/linux-unpacked/resources/app-update.yml', 'utf8'));
          if (config.gitcrestUpdatePublicKey !== publicKey) throw new Error('The packaged Linux updater key does not match the private signing key.');
          if (!load(await readFile('dist/latest-linux.yml', 'utf8'))?.files?.length) throw new Error('The Linux update manifest is missing.');
          NODE

      - name: Launch packaged app and verify sidecar shutdown
        if: matrix.platform != 'linux'
        run: pnpm test:packaged

      - name: Launch packaged Linux app under Xvfb and verify sidecar shutdown
        if: matrix.platform == 'linux'
        run: xvfb-run -a pnpm test:packaged

      - uses: actions/upload-artifact@v4
        with:
          name: gitcrest-release-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  publish:
    name: Sign update metadata and publish release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Verify version tag
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$version"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: gitcrest-release-windows
          path: dist/windows

      - uses: actions/download-artifact@v4
        with:
          name: gitcrest-release-macos
          path: dist/macos

      - uses: actions/download-artifact@v4
        with:
          name: gitcrest-release-linux
          path: dist/linux

      - name: Sign and verify Linux update manifest
        shell: bash
        env:
          LINUX_UPDATE_SIGNING_KEY: ${{ secrets.LINUX_UPDATE_SIGNING_KEY }}
        run: |
          key_file="$RUNNER_TEMP/gitcrest-linux-update-signing-key.pem"
          umask 077
          printf '%s' "$LINUX_UPDATE_SIGNING_KEY" > "$key_file"
          pnpm release:sign-linux-update-manifest dist/linux/latest-linux.yml "$key_file"
          node --input-type=module <<'NODE'
          import { createPrivateKey, createPublicKey } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          import { load } from 'js-yaml';
          import { verifyLinuxUpdateInfoSignature } from './electron/main/update-manifest-signature-policy.mjs';

          const key = createPrivateKey(process.env.LINUX_UPDATE_SIGNING_KEY);
          const publicKey = createPublicKey(key).export({ type: 'spki', format: 'der' }).toString('base64');
          const manifest = load(await readFile('dist/linux/latest-linux.yml', 'utf8'));
          if (!verifyLinuxUpdateInfoSignature(manifest, publicKey)) throw new Error('Linux update manifest signature verification failed.');
          NODE

      - name: Publish signed Windows, macOS, and Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          windows=(dist/windows/*.exe dist/windows/*.yml dist/windows/*.blockmap)
          macos=(dist/macos/*.dmg dist/macos/*.zip dist/macos/*.yml dist/macos/*.blockmap)
          linux=(dist/linux/*.AppImage dist/linux/latest-linux.yml)
          if (( ${#windows[@]} < 2 || ${#macos[@]} < 3 || ${#linux[@]} != 2 )); then
            echo 'One or more signed platform release assets are missing.' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" "${windows[@]}" "${macos[@]}" "${linux[@]}" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
