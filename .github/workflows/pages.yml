name: Deploy landing page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm website:check
      - run: pnpm website:build
        env:
          WEBSITE_BASE_PATH: ${{ format('{0}/', steps.pages.outputs.base_path) }}
          WEBSITE_PUBLIC_URL: ${{ format('{0}/', steps.pages.outputs.base_url) }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
