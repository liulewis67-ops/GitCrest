[package]
name = "gitcrest-core"
version = "0.1.6"
edition = "2021"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
git2 = { version = "0.20.4", default-features = false, features = ["vendored-libgit2"] }
libc = "0.2"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
notify = "8.2.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
reqwest = { version = "0.12.26", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "fs", "time", "sync", "io-util", "io-std", "signal"] }
tempfile = "3"
tower-http = { version = "0.5", features = ["cors"] }
url = "2"
zeroize = { version = "1.9.0", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.24"
