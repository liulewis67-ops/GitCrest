[package]
name = "gitcrest-core"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
libc = "0.2"
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.12.26", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "fs", "time", "sync", "io-util"] }
tower-http = { version = "0.5", features = ["cors"] }
zeroize = { version = "1.9.0", features = ["serde"] }

[dev-dependencies]
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.24"
tempfile = "3"
