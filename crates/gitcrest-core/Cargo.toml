[package]
name = "gitcrest-core"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "fs", "time"] }
tower-http = { version = "0.5", features = ["cors"] }

[dev-dependencies]
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.24"
tempfile = "3"
